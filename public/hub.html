<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AgriConnect | Community Exchange Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #16a34a;
            --primary-dark: #15803d;
            --primary-soft: #dcfce7;
            --secondary: #facc15;
            --group-color: #8b5cf6;
            --group-soft: #ede9fe;
            --bg: #f8fafc;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --white: #ffffff;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
            --shadow-xl: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
            --radius-card: 20px;
            --radius-element: 12px;
            --transition-fast: 0.2s ease;
            --transition-normal: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* Hero Section */
        .exchange-hero {
            background: linear-gradient(135deg, rgba(22, 163, 74, 0.92) 0%, rgba(21, 128, 61, 0.95) 100%), 
                        url('https://images.unsplash.com/photo-1523348837708-15d4a09cfac2?auto=format&fit=crop&w=1600&q=80');
            background-size: cover;
            background-position: center 35%;
            background-blend-mode: overlay;
            padding: 3rem 1.5rem;
            text-align: center;
            position: relative;
        }

        .hero-content h1 {
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #ffffff 0%, #fef3c7 100%);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.75rem;
        }

        .hero-content p {
            font-size: clamp(0.9rem, 3vw, 1.1rem);
            color: rgba(255,255,255,0.95);
            max-width: 550px;
            margin: 0 auto;
            font-weight: 500;
        }

        /* Navigation & Controls - Floating Card */
        .controls-container {
            max-width: 1200px;
            margin: -1.8rem auto 2rem;
            background: var(--white);
            padding: 1.25rem 1.5rem;
            border-radius: 24px;
            box-shadow: var(--shadow-xl);
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255,255,255,0.5);
        }

        .search-box {
            flex: 2;
            min-width: 240px;
            position: relative;
        }

        .search-box i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1rem;
            pointer-events: none;
        }

        .search-box input {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.8rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 60px;
            font-size: 0.95rem;
            font-weight: 500;
            transition: var(--transition-normal);
            background: var(--white);
            font-family: 'Inter', sans-serif;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(22,163,74,0.15);
        }

        .filter-select {
            padding: 0.85rem 1.5rem;
            border-radius: 60px;
            border: 1.5px solid #e2e8f0;
            background: var(--white);
            font-weight: 600;
            color: var(--text-dark);
            cursor: pointer;
            transition: var(--transition-fast);
            font-family: 'Inter', sans-serif;
        }

        .filter-select:hover {
            border-color: var(--primary);
        }

        .post-btn {
            background: linear-gradient(105deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            padding: 0.85rem 1.8rem;
            border-radius: 60px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition-normal);
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.95rem;
            box-shadow: var(--shadow-sm);
        }

        .post-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
            filter: brightness(1.05);
        }

        /* Listing Grid - Responsive */
        .listing-grid {
            max-width: 1200px;
            margin: 0 auto 3rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.75rem;
            padding: 0 1.5rem;
        }

        /* Card Styles with Animations */
        .item-card {
            background: var(--white);
            border-radius: var(--radius-card);
            overflow: hidden;
            border: 1px solid rgba(226, 232, 240, 0.8);
            transition: var(--transition-normal);
            display: flex;
            flex-direction: column;
            animation: cardFadeInUp 0.5s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
            box-shadow: var(--shadow-sm);
        }

        @keyframes cardFadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .item-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-xl);
            border-color: var(--primary-soft);
        }

        /* Stagger animation for cards */
        .item-card:nth-child(1) { animation-delay: 0.05s; }
        .item-card:nth-child(2) { animation-delay: 0.1s; }
        .item-card:nth-child(3) { animation-delay: 0.15s; }
        .item-card:nth-child(4) { animation-delay: 0.2s; }
        .item-card:nth-child(5) { animation-delay: 0.25s; }
        .item-card:nth-child(6) { animation-delay: 0.3s; }

        .item-body {
            padding: 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        /* Badges */
        .badge-container {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .badge {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.3rem 0.9rem;
            border-radius: 40px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            backdrop-filter: blur(2px);
        }

        .badge-seed {
            background: var(--primary-soft);
            color: #166534;
            border-left: 3px solid var(--primary);
        }

        .badge-tool {
            background: #fef3c7;
            color: #92400e;
            border-left: 3px solid var(--secondary);
        }

        .badge-normal {
            background: #f1f5f9;
            color: #475569;
        }

        .badge-group {
            background: var(--group-soft);
            color: #6d28d9;
            border-left: 3px solid var(--group-color);
        }

        .item-title {
            font-size: 1.35rem;
            font-weight: 700;
            margin: 0 0 0.6rem 0;
            line-height: 1.35;
            letter-spacing: -0.3px;
            color: var(--text-dark);
        }

        .item-desc {
            font-size: 0.9rem;
            color: #475569;
            line-height: 1.55;
            margin-bottom: 1.2rem;
            flex-grow: 1;
        }

        /* Group Progress Logic */
        .member-count-wrapper {
            margin-bottom: 1.2rem;
            background: #f8fafc;
            padding: 0.8rem;
            border-radius: 14px;
        }

        .member-count-bar {
            background: #e2e8f0;
            height: 8px;
            border-radius: 10px;
            overflow: hidden;
        }

        .member-progress {
            background: var(--group-color);
            height: 100%;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 10px;
        }

        .member-text {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            margin-top: 0.5rem;
        }

        /* Meta info */
        .meta-info {
            font-size: 0.8rem;
            background: #f8fafc;
            padding: 0.6rem 0.9rem;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 1.2rem;
            color: var(--text-muted);
            flex-wrap: wrap;
        }

        .meta-info i {
            color: var(--primary);
            width: 1rem;
        }

        /* Buttons */
        .request-btn {
            width: 100%;
            padding: 0.8rem;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
        }

        .btn-individual {
            background: #f1f5f9;
            color: var(--primary);
            border: 1px solid #cbd5e1;
        }

        .btn-individual:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            transform: scale(0.98);
        }

        .btn-group {
            background: var(--group-color);
            color: white;
            box-shadow: 0 2px 8px rgba(139, 92, 246, 0.3);
        }

        .btn-group:hover {
            background: #7c3aed;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4);
        }

        .owner-panel {
            background: #f0fdf4;
            border: 1px dashed var(--primary);
            padding: 1rem;
            border-radius: 14px;
            margin-top: 1rem;
            animation: panelFade 0.3s ease;
        }

        @keyframes panelFade {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .member-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.6rem 0;
            border-bottom: 1px solid #dcfce7;
            font-size: 0.85rem;
        }

        .member-item:last-child {
            border-bottom: none;
        }

        .member-item a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.65);
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(6px);
            animation: modalBgFade 0.2s ease;
        }

        @keyframes modalBgFade {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: var(--white);
            padding: 1.8rem;
            border-radius: 28px;
            width: 90%;
            max-width: 520px;
            position: relative;
            animation: modalSlideIn 0.3s cubic-bezier(0.34, 1.2, 0.64, 1);
            box-shadow: var(--shadow-xl);
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: scale(0.96) translateY(-20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-content h2 {
            margin-top: 0;
            margin-bottom: 1.2rem;
            color: var(--primary);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-dark);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            transition: var(--transition-fast);
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(22,163,74,0.1);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem 2rem;
            background: white;
            border-radius: 28px;
            grid-column: 1 / -1;
            color: var(--text-muted);
        }

        /* Mobile & Tablet Responsive */
        @media (max-width: 768px) {
            .controls-container {
                margin: -1.5rem 1rem 1.5rem;
                flex-direction: column;
                align-items: stretch;
                padding: 1.2rem;
                gap: 0.8rem;
            }

            .listing-grid {
                grid-template-columns: 1fr;
                gap: 1.25rem;
                padding: 0 1rem;
            }

            .item-body {
                padding: 1.2rem;
            }

            .post-btn {
                justify-content: center;
            }

            .search-box {
                min-width: auto;
            }

            .hero-content h1 {
                font-size: 1.8rem;
            }
        }

        @media (max-width: 480px) {
            .exchange-hero {
                padding: 2rem 1rem;
            }

            .hero-content h1 {
                font-size: 1.5rem;
            }

            .controls-container {
                margin: -1.2rem 0.75rem 1.2rem;
            }

            .modal-content {
                padding: 1.5rem;
            }

            .badge-container {
                gap: 0.4rem;
            }

            .item-title {
                font-size: 1.2rem;
            }

            .meta-info {
                font-size: 0.7rem;
                gap: 0.4rem;
            }
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #e2e8f0;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-dark);
        }
    </style>
</head>
<body>

    <section class="exchange-hero">
        <div class="hero-content">
            <h1><i class="fas fa-handshake"></i> Community Exchange Hub</h1>
            <p>Share surplus seeds or rent tools within your local farming group.</p>
        </div>
    </section>

    <div class="controls-container">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="hubSearch" placeholder="Search by crop, tool name, or location...">
        </div>
        <select class="filter-select" id="hubCategoryFilter">
            <option value="all">All Items</option>
            <option value="seed">🌱 Seeds/Plants</option>
            <option value="tool">🔧 Tools/Gear</option>
        </select>
        <button class="post-btn" onclick="toggleHubModal(true)"><i class="fas fa-plus-circle"></i> Post Listing</button>
    </div>

    <div class="listing-grid" id="listingGrid">
        <!-- Cards will be injected here -->
    </div>

    <!-- Modal -->
    <div id="hubModal" class="modal">
        <div class="modal-content">
            <h2><i class="fas fa-leaf"></i> New Listing</h2>
            <form id="hubListingForm">
                <div class="form-group">
                    <label>Item Title</label>
                    <input type="text" id="formTitle" placeholder="e.g., Bulk Fertilizer Order" required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="formType" required>
                        <option value="seed">🌾 Seeds / Plants</option>
                        <option value="tool">🛠️ Tools / Machinery</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Type of Listing</label>
                    <select id="formExchangeType" onchange="toggleGroupSizeField()">
                        <option value="normal">Normal (1-to-1 Swap)</option>
                        <option value="group">Group (Community Bulk Buy/Task)</option>
                    </select>
                </div>
                <div id="groupSizeContainer" class="form-group" style="display: none; border-left: 3px solid var(--group-color); padding-left: 0.8rem;">
                    <label>Target Group Size (People Required)</label>
                    <input type="number" id="formTargetSize" placeholder="Enter number (e.g., 10)" min="2">
                    <small style="color: var(--text-muted);">How many people must join to complete this task?</small>
                </div>
                <div class="form-group">
                    <label>Location</label>
                    <input type="text" id="formLocation" placeholder="Village / City" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="formDesc" rows="3" placeholder="Describe your offer or group requirement..." required></textarea>
                </div>
                <button type="submit" class="post-btn" style="width:100%; background: var(--primary);"><i class="fas fa-check-circle"></i> Publish Listing</button>
            </form>
        </div>
    </div>

    <script>
        // Original logic preserved exactly with enhanced UI
        const user = JSON.parse(localStorage.getItem('agriUser'));
        if (!user) { 
            alert("Login required! Redirecting to login page."); 
            window.location.href = 'login.html'; 
        }

        function toggleHubModal(show) { 
            document.getElementById('hubModal').style.display = show ? 'flex' : 'none'; 
        }

        // Show/Hide Group Size Field
        function toggleGroupSizeField() {
            const type = document.getElementById('formExchangeType').value;
            const container = document.getElementById('groupSizeContainer');
            const input = document.getElementById('formTargetSize');

            if (type === 'group') {
                container.style.display = 'block';
                input.setAttribute('required', 'true');
            } else {
                container.style.display = 'none';
                input.removeAttribute('required');
                input.value = '';
            }
        }

        // Submit handler (preserving original payload)
        document.getElementById('hubListingForm').onsubmit = async (e) => {
            e.preventDefault();
            const user = JSON.parse(localStorage.getItem('agriUser'));
            
            const payload = {
                userId: user.id,
                authorName: user.name,
                contactNumber: user.contact_number,
                title: document.getElementById('formTitle').value,
                category: document.getElementById('formType').value,
                exchangeType: document.getElementById('formExchangeType').value,
                targetSize: document.getElementById('formTargetSize').value || 1,
                location: document.getElementById('formLocation').value,
                description: document.getElementById('formDesc').value
            };

            const res = await fetch('/api/hub-listings', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                alert("Listing Published Successfully!");
                toggleHubModal(false);
                fetchHubData();
                document.getElementById('hubListingForm').reset();
                toggleGroupSizeField();
            } else {
                alert("Failed to publish. Please try again.");
            }
        };

        // Render function with enhanced UI (keeping original structure and animations)
        function renderHub(items) {
            const grid = document.getElementById('listingGrid');
            const user = JSON.parse(localStorage.getItem('agriUser'));

            if (!items || items.length === 0) {
                grid.innerHTML = '<div class="empty-state"><i class="fas fa-seedling" style="font-size: 3rem; opacity: 0.5;"></i><h3>No listings found</h3><p>Be the first to share or start a group!</p></div>';
                return;
            }

            grid.innerHTML = items.map(item => {
                const isGroup = item.exchange_type === 'group';
                const isOwner = user && item.user_id === user.id;
                const target = item.target_size || (isGroup ? 10 : 1);
                const progress = isGroup ? Math.min((item.member_count / target) * 100, 100) : 0;

                return `
                <div class="item-card" style="border-top: 4px solid ${isGroup ? 'var(--group-color)' : 'var(--primary)'}">
                    <div class="item-body">
                        <div class="badge-container">
                            <span class="badge ${item.category === 'tool' ? 'badge-tool' : 'badge-seed'}">${item.category === 'tool' ? '🛠️ Tool/Gear' : '🌱 Seeds/Plants'}</span>
                            <span class="badge ${isGroup ? 'badge-group' : 'badge-normal'}">${isGroup ? '👥 Group Hub' : '🤝 Individual'}</span>
                        </div>
                        <h3 class="item-title">${escapeHtml(item.title)}</h3>
                        <p class="item-desc">${escapeHtml(item.description)}</p>
                        
                        ${isGroup ? `
                            <div class="member-count-wrapper">
                                <div class="member-count-bar"><div class="member-progress" style="width:${progress}%"></div></div>
                                <div class="member-text">
                                    <span><i class="fas fa-users"></i> ${item.member_count} / ${target} Members Joined</span>
                                    <span>${progress >= 100 ? '<i class="fas fa-check-circle"></i> Ready' : '<i class="fas fa-clock"></i> Joining'}</span>
                                </div>
                            </div>
                        ` : ''}

                        <div class="meta-info">
                            <i class="fas fa-user-circle"></i> ${escapeHtml(item.author_name)} ${isOwner ? '<strong style="color:var(--primary)"> (You)</strong>' : ''}
                            <i class="fas fa-map-marker-alt"></i> ${escapeHtml(item.location)}
                        </div>

                        <div class="card-actions">
                            ${!isGroup ? `
                                <button class="request-btn btn-individual" onclick="window.open('https://wa.me/91${item.contact_number}')">
                                    <i class="fab fa-whatsapp"></i> Chat with Farmer
                                </button>
                            ` : `
                                ${isOwner ? `
                                    <button class="request-btn btn-group" onclick="toggleMembers(${item.id})">
                                        <i class="fas fa-eye"></i> View Joined Contacts
                                    </button>
                                    <div id="mem-list-${item.id}" class="owner-panel" style="display:none">Loading members...</div>
                                ` : `
                                    <button class="request-btn btn-group" onclick="joinGroup(${item.id})">
                                        <i class="fas fa-hand-peace"></i> Join Group Hub
                                    </button>
                                `}
                            `}
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // Fetch data from API
        async function fetchHubData() {
            const grid = document.getElementById('listingGrid');
            const user = JSON.parse(localStorage.getItem('agriUser'));
            
            try {
                const response = await fetch('/api/hub-listings');
                if (!response.ok) throw new Error('Network response was not ok');
                const items = await response.json();
                
                if (!items || items.length === 0) {
                    grid.innerHTML = '<div class="empty-state"><i class="fas fa-seedling" style="font-size: 3rem; opacity: 0.5;"></i><h3>No listings yet</h3><p>Click "Post Listing" to share with your community.</p></div>';
                    return;
                }
                
                // Apply search and filter
                const searchTerm = document.getElementById('hubSearch')?.value.toLowerCase() || '';
                const categoryFilter = document.getElementById('hubCategoryFilter')?.value || 'all';
                
                let filtered = items.filter(item => {
                    const matchesSearch = item.title.toLowerCase().includes(searchTerm) || 
                                         item.description.toLowerCase().includes(searchTerm) ||
                                         item.location.toLowerCase().includes(searchTerm);
                    const matchesCategory = categoryFilter === 'all' || item.category === categoryFilter;
                    return matchesSearch && matchesCategory;
                });
                
                renderHub(filtered);
            } catch (err) {
                console.error("Fetch Error:", err);
                grid.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Failed to load listings from server. Please check connection.</p></div>';
            }
        }

        // Join group function (original)
        async function joinGroup(id) {
            const user = JSON.parse(localStorage.getItem('agriUser'));
            if (!user) {
                alert("Please login first to join a group!");
                window.location.href = 'login.html';
                return;
            }

            try {
                const res = await fetch('/api/hub/join-group', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ 
                        listingId: id, 
                        userId: user.id, 
                        userName: user.name, 
                        userContact: user.contact_number 
                    })
                });
                
                const data = await res.json();
                alert(data.message);
                
                if (data.success) {
                    fetchHubData();
                }
            } catch (error) {
                console.error("Join error:", error);
                alert("Error joining group. Please try again.");
            }
        }

        // Toggle members panel (original)
        async function toggleMembers(id) {
            const div = document.getElementById(`mem-list-${id}`);
            if (div.style.display === 'block') { 
                div.style.display = 'none'; 
                return; 
            }
            
            try {
                const res = await fetch(`/api/hub/group-details/${id}`);
                const members = await res.json();
                div.innerHTML = members.length ? members.map(m => `
                    <div class="member-item">
                        <span><i class="fas fa-user-friend"></i> ${escapeHtml(m.user_name)}</span>
                        <a href="tel:${m.user_contact}"><i class="fas fa-phone-alt"></i> ${m.user_contact}</a>
                    </div>`).join('') : '<p style="text-align:center;">No members yet. Invite others!</p>';
                div.style.display = 'block';
            } catch (err) {
                div.innerHTML = '<p>Failed to load members.</p>';
                div.style.display = 'block';
            }
        }

        // Search and filter event listeners
        document.getElementById('hubSearch')?.addEventListener('input', () => fetchHubData());
        document.getElementById('hubCategoryFilter')?.addEventListener('change', () => fetchHubData());

        window.onload = fetchHubData;
    </script>
</body>
</html>
