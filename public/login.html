
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AgriConnect Hub</title>
    <link rel="stylesheet" href="agri.css">
   <style>
    /* RESET */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", system-ui, sans-serif;
}

/* PAGE BACKGROUND */
body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: url("https://images.unsplash.com/photo-1523741543316-beb7fc7023d8")
        no-repeat center center / cover;
    position: relative;
    overflow: hidden;
}

/* SUBTLE OVERLAY (very light) */
body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: url("https://images.unsplash.com/photo-1523741543316-beb7fc7023d8")
        no-repeat center center / cover;
}



/* AUTH CARD */
.auth-container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    background: rgba(255, 255, 255, 0.97);
    padding: 36px 32px;
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.45);
    box-shadow: 0 18px 45px rgba(0, 0, 0, 0.22);
    animation: cardEnter 0.8s ease;
}

/* ANIMATION */
@keyframes cardEnter {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* HEADINGS */
.auth-container h2 {
    text-align: center;
    font-size: 1.9rem;
    font-weight: 700;
    color: #53c758;
    margin-bottom: 6px;
}

.auth-container p {
    text-align: center;
    font-size: 0.95rem;
    color: #666;
    margin-bottom: 30px;
}

/* FORM */
.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: #444;
    margin-bottom: 6px;
}

.search-input {
    width: 100%;
    padding: 12px 14px;
    font-size: 0.95rem;
    border-radius: 8px;
    border: 1px solid #ccc;
    background: #fff;
    transition: border-color 0.3s, box-shadow 0.3s;
}

.search-input::placeholder {
    color: #aaa;
}

.search-input:focus {
    outline: none;
    border-color: #2e7d32;
    box-shadow: 0 0 0 2px rgba(46, 125, 50, 0.15);
}

/* BUTTON */
.btn-apply {
    width: 100%;
    padding: 13px;
    margin-top: 8px;
    font-size: 1.05rem;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, #2e7d32, #4caf50);
    color: #ffffff;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.btn-apply:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
}

.btn-apply:active {
    transform: translateY(0);
    box-shadow: 0 5px 12px rgba(0, 0, 0, 0.22);
}

/* MESSAGE */
#loginMessage {
    text-align: center;
    margin-top: 14px;
    font-size: 0.85rem;
    color: #555;
}

/* FOOTER LINKS */
.auth-container a {
    color: #2e7d32;
    text-decoration: none;
    font-weight: 600;
}

.auth-container a:hover {
    text-decoration: underline;
}

/* MOBILE */
@media (max-width: 480px) {
    .auth-container {
        padding: 28px 22px;
        border-radius: 14px;
    }

    .auth-container h2 {
        font-size: 1.6rem;
    }
}
   </style>
</head>
<body>

    <div class="auth-container">
        <h2 style="text-align: center; color: var(--dark-green); margin-top: 0;">AgriConnect Hub</h2>
        <p style="text-align: center; color: var(--text-light); margin-bottom: 2rem;">Login to your account.</p>
        
        <form action="/login" method="POST" id="loginForm">
            <div class="form-group">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" class="search-input" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" class="search-input" placeholder="••••••••" required>
            </div>
            <button type="submit" id="loginButton" class="btn-apply" style="width: 100%; margin-top: 1rem; font-size: 1.1rem;">Login</button>
            <p id="loginMessage" style="text-align: center; margin-top: 1rem;"></p>
        </form>
        
        <p style="text-align: center; margin-top: 1.5rem;">
            Don't have an account? <a href="signup.html" style="color: var(--primary-green); font-weight: 600;">Sign Up</a>
        </p>
         <p style="text-align: center; margin-top: 1rem;">
            <a href="agri2.html" style="color: var(--text-light); font-size: 0.9rem;">&larr; Back to Home</a>
        </p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault(); 

            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const messageEl = document.getElementById('loginMessage');
            const button = document.getElementById('loginButton');

            button.disabled = true;
            messageEl.textContent = 'Logging in...';

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.success) {
                    messageEl.style.color = 'var(--dark-green)';
                    messageEl.textContent = data.message;
                    
                    localStorage.setItem('agriUser', JSON.stringify(data.user));
                    
                    setTimeout(() => {
                        window.location.href = '/agri2.html';
                    }, 2000);
                } else {
                    messageEl.style.color = 'red';
                    messageEl.textContent = data.message;
                    button.disabled = false;
                }
            } catch (err) {
                messageEl.style.color = 'red';
                messageEl.textContent = 'An error occurred. Please try again.';
                button.disabled = false;
            }
        });
    </script>

</body>
</html>
