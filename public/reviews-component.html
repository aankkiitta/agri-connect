<div class="reviews-wrapper">
  <h3 class="section-title">What Our Customers Say</h3>

  <div class="review-summary">
    <span id="avgRating">0.0 ★ (0 reviews)</span>
  </div>

  <div class="review-form">
    <input id="reviewUser" placeholder="Your name (optional)" />

    <div class="review-stars">
      <span class="star" data-star="1">★</span>
      <span class="star" data-star="2">★</span>
      <span class="star" data-star="3">★</span>
      <span class="star" data-star="4">★</span>
      <span class="star" data-star="5">★</span>
    </div>

    <textarea
      id="reviewText"
      placeholder="Write your experience here..."
    ></textarea>

    <div class="review-upload">
      <label>
        Photo:
        <input type="file" id="userPhoto" accept="image/*" />
      </label>
    </div>

    <button onclick="submitReview()">Submit Review</button>
  </div>

  <div id="reviewList"></div>

  <div class="review-pagination">
    <button onclick="window.prevPage()">Prev</button>
    
    <span id="pageIndicator">Page 1</span> 
    
    <button onclick="window.nextPage()">Next</button>
</div>
</div>
