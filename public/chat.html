<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KISAN CIRCLE Chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="/css/chat.css">
    <style>
        /* Full page chat - no header/nav */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ADA9E8, #434361, #00D4FF);
        }
        #chat-full-page {
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #chat-widget-container {
            position: relative !important;
            width: 100% !important;
            height: 100vh !important;
            max-width: 100% !important;
            max-height: 100vh !important;
            bottom: 0 !important;
            right: 0 !important;
            border-radius: 0 !important;
            box-shadow: none !important;
            display: flex !important;
            flex-direction: column !important;
            background: linear-gradient(135deg, #ADA9E8, #434361, #00D4FF);
        }
        #chat-launcher {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- Full Page Chat -->
    <div id="chat-full-page">
        <div id="chat-widget-container" class="full-page active">
            <!-- Header -->
            <nav>
                <h1>💬 KISAN CIRCLE GROUP</h1>
                <div id="user-count-container">
                    <span id="user-count-dot"></span>
                    <span id="user-count-text">Connecting...</span>
                </div>
            </nav>

            <!-- Messages Area -->
            <div class="container active" id="messageContainer"></div>

            <!-- Typing Indicator -->
            <div id="typing-indicator"></div>

            <!-- Message Input Area -->
            <div class="send active">
                <input type="file" id="image-input" accept="image/*" style="display: none;">
                <form action="#" id="send-container">
                    <button type="button" class="btn-icon" id="attach-file-btn">
                        <i class="fa-solid fa-paperclip"></i>
                    </button>
                    <input type="text" name="messageimp" id="messageimp" placeholder="Type a message..." autocomplete="off">
                    <button class="btn" type="submit" id="send-btn" style="display: none;">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                    <button type="button" class="btn" id="record-btn">
                        <i class="fa-solid fa-microphone"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Load Socket.IO -->
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <!-- Load Chat JavaScript -->
    <script src="/js/chat.js"></script>
</body>
</html>
