<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KISAN CIRCLE - Group Chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #chat-widget-container {
            width: 400px !important;
            height: 550px !important;
            max-width: 95vw !important;
            max-height: 90vh !important;
            display: flex !important;
            flex-direction: column !important;
            background: linear-gradient(135deg, #ADA9E8, #434361, #00D4FF);
            border-radius: 18px !important;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.6) !important;
            overflow: hidden !important;
            position: relative !important;
        }
        
        /* Header */
        #chat-widget-container nav {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.15);
            padding: 12px 16px;
            justify-content: space-between;
            flex-shrink: 0;
        }
        
        #chat-widget-container h1 {
            font-size: 1rem;
            margin: 0;
            flex: 1;
            color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        #user-count-container {
            display: flex;
            align-items: center;
            margin-right: 8px;
            padding: 3px 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
        }
        
        #user-count-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
            background-color: #32CD32;
        }
        
        #user-count-text {
            font-size: 0.75rem;
            font-weight: 600;
            color: white;
            white-space: nowrap;
        }
        
        #chat-widget-close {
            background: none;
            border: none;
            font-size: 1.6rem;
            line-height: 1;
            color: white;
            cursor: pointer;
            padding: 0 5px;
            opacity: 0.7;
        }
        
        #chat-widget-close:hover {
            opacity: 1;
        }
        
        /* Messages Area */
        #chat-widget-container .container {
            flex: 1;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(6px);
            padding: 12px 14px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }
        
        #chat-widget-container .container::-webkit-scrollbar {
            width: 4px;
        }
        
        #chat-widget-container .container::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }
        
        /* Message Bubbles */
        #chat-widget-container .message {
            max-width: 80%;
            padding: 0;
            margin: 4px 0;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.4;
            word-wrap: break-word;
            clear: both;
            box-shadow: 0 1px 2px rgba(0,0,0,0.06);
        }
        
        #chat-widget-container .right {
            background-color: #DCF8C6;
            color: #1a1a2e;
            float: right;
            align-self: flex-end;
            border-bottom-right-radius: 3px;
        }
        
        #chat-widget-container .left {
            background-color: #ffffff;
            color: #1a1a2e;
            float: left;
            align-self: flex-start;
            border-bottom-left-radius: 3px;
        }
        
        #chat-widget-container .message-body {
            padding: 8px 12px 3px 12px;
            font-size: 0.9rem;
        }
        
        #chat-widget-container .message-header {
            padding: 0 12px 6px 12px;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            align-items: center;
        }
        
        #chat-widget-container .message-name {
            font-weight: 700;
            color: #6C4DFF;
            font-size: 0.7rem;
        }
        
        #chat-widget-container .message-info {
            font-size: 0.6rem;
            color: #888;
            opacity: 0.6;
        }
        
        #chat-widget-container .right .message-header {
            display: none;
        }
        
        #chat-widget-container .right .message-body {
            padding-bottom: 8px;
        }
        
        /* System Messages */
        #chat-widget-container .message.middle {
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            background: rgba(0, 0, 0, 0.12);
            font-style: italic;
            font-size: 10px;
            border: none;
            padding: 4px 12px;
            margin: 4px auto;
            width: fit-content;
            max-width: 80%;
            align-self: center;
            float: none;
            box-shadow: none;
            border-radius: 12px;
        }
        
        /* Image Messages */
        #chat-widget-container .message-body a {
            text-decoration: none;
        }
        
        #chat-widget-container .message-image {
            max-width: 180px;
            width: 100%;
            border-radius: 8px;
            margin-top: 4px;
            cursor: pointer;
        }
        
        #chat-widget-container .message-body:has(.message-image) {
            padding: 4px 4px 0 4px;
        }
        
        #chat-widget-container .right .message-body:has(.message-image) {
            padding-bottom: 0;
        }
        
        /* Audio Messages */
        #chat-widget-container .message-body audio {
            width: 100%;
            min-width: 140px;
            height: 32px;
            border-radius: 6px;
        }
        
        /* Typing Indicator */
        #typing-indicator {
            height: 22px;
            padding: 0 14px 4px 14px;
            font-size: 0.75rem;
            font-style: italic;
            color: rgba(255, 255, 255, 0.85);
            background: transparent;
            min-height: 22px;
        }
        
        /* Input Area */
        #chat-widget-container .send {
            width: 100%;
            display: flex;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.92);
            flex-shrink: 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        #send-container {
            display: flex;
            align-items: center;
            width: 100%;
            gap: 6px;
        }
        
        #messageimp {
            flex: 1;
            padding: 8px 12px;
            font-size: 13px;
            border-radius: 18px;
            border: 1px solid #ccc;
            outline: none;
            font-family: 'Segoe UI', sans-serif;
            background: #f8f8f8;
            transition: border-color 0.3s ease;
        }
        
        #messageimp:focus {
            border-color: #6C4DFF;
            background: white;
        }
        
        .btn-icon {
            background: none;
            border: none;
            font-size: 1rem;
            color: #555;
            cursor: pointer;
            padding: 0 6px;
            transition: color 0.2s ease;
        }
        
        .btn-icon:hover {
            color: #6C4DFF;
        }
        
        .btn {
            padding: 0;
            width: 34px;
            height: 34px;
            background: linear-gradient(135deg, #6C4DFF, #8B5CFF);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(108, 77, 255, 0.3);
        }
        
        .btn i {
            font-size: 13px;
        }
        
        /* Make Send Button Always Visible */
        #send-btn {
            display: flex !important;
        }
        
        /* Recording Animation */
        @keyframes pulse-record {
            0% { box-shadow: 0 0 0 0 rgba(244, 67, 54, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(244, 67, 54, 0); }
            100% { box-shadow: 0 0 0 0 rgba(244, 67, 54, 0); }
        }
        
        #record-btn.recording {
            background-color: #F44336;
            animation: pulse-record 1.5s infinite;
        }
        
        /* Unauthorized / Login Required */
        #login-required {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
        }
        
        #login-required .login-box {
            background: white;
            padding: 32px 24px;
            border-radius: 16px;
            text-align: center;
            max-width: 280px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        #login-required .login-box h2 {
            color: #333;
            margin-bottom: 8px;
            font-size: 1.2rem;
        }
        
        #login-required .login-box p {
            color: #666;
            margin: 10px 0 20px 0;
            font-size: 0.85rem;
        }
        
        #login-required .login-box .login-btn {
            background: linear-gradient(135deg, #6C4DFF, #8B5CFF);
            color: white;
            padding: 10px 30px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.95rem;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        #login-required .login-box .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(108, 77, 255, 0.3);
        }
        
        #login-required .login-box .logout-btn {
            background: #e74c3c;
            color: white;
            padding: 8px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            margin-top: 10px;
            transition: opacity 0.2s;
        }
        
        #login-required .login-box .logout-btn:hover {
            opacity: 0.8;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 10px;
        }
        
        .user-info .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6C4DFF, #8B5CFF);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 600;
            flex-shrink: 0;
        }
        
        .user-info .user-details {
            flex: 1;
            text-align: left;
        }
        
        .user-info .user-details .name {
            font-weight: 600;
            color: #333;
            font-size: 0.95rem;
        }
        
        .user-info .user-details .email {
            color: #888;
            font-size: 0.75rem;
        }
        
        /* Mobile Responsive */
        @media (max-width: 480px) {
            #chat-widget-container {
                width: 95vw !important;
                height: 80vh !important;
                max-height: 92vh !important;
                border-radius: 14px !important;
            }
            
            #chat-widget-container nav {
                padding: 8px 12px;
            }
            
            #chat-widget-container h1 {
                font-size: 0.85rem;
            }
            
            #user-count-text {
                font-size: 0.65rem;
            }
            
            #user-count-container {
                padding: 2px 8px;
            }
            
            #user-count-dot {
                width: 6px;
                height: 6px;
                margin-right: 4px;
            }
            
            #chat-widget-container .container {
                padding: 8px 10px;
            }
            
            #chat-widget-container .message-body {
                font-size: 0.85rem;
                padding: 6px 10px 2px 10px;
            }
            
            #chat-widget-container .message-header {
                padding: 0 10px 4px 10px;
            }
            
            #chat-widget-container .message-name {
                font-size: 0.6rem;
            }
            
            #chat-widget-container .message-info {
                font-size: 0.55rem;
            }
            
            #chat-widget-container .send {
                padding: 6px 10px;
            }
            
            #messageimp {
                font-size: 12px;
                padding: 6px 10px;
            }
            
            .btn {
                width: 32px;
                height: 32px;
            }
            
            .btn i {
                font-size: 12px;
            }
            
            .btn-icon {
                font-size: 0.9rem;
                padding: 0 4px;
            }
            
            #chat-widget-container .message-image {
                max-width: 130px;
            }
            
            #chat-widget-container .message-body audio {
                min-width: 100px;
                height: 28px;
            }
            
            #chat-widget-container .message.middle {
                font-size: 9px;
                padding: 3px 8px;
            }
            
            #login-required .login-box {
                padding: 24px 16px;
            }
        }

        /* ========== CHAT FAB (Floating Action Button) ========== */
#chat-fab-container {
    position: fixed;
    bottom: 30px;
    right: 30px;
    z-index: 9999;
}

.chat-fab {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6C4DFF, #8B5CFF);
    color: white;
    border: none;
    box-shadow: 0 4px 20px rgba(108, 77, 255, 0.4);
    cursor: pointer;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.chat-fab:hover {
    transform: scale(1.08);
    box-shadow: 0 6px 30px rgba(108, 77, 255, 0.6);
}

.chat-fab:active {
    transform: scale(0.95);
}

.chat-fab i {
    font-size: 26px;
}

.chat-fab .chat-notification {
    position: absolute;
    top: -5px;
    right: -5px;
    background: #FF4444;
    color: white;
    border-radius: 50%;
    width: 22px;
    height: 22px;
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid white;
    animation: pulse-notification 2s infinite;
    display: none;
}

.chat-fab .chat-notification.active {
    display: flex;
}

@keyframes pulse-notification {
    0% { transform: scale(1); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); }
}

/* ========== CHAT MODAL ========== */
.chat-modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(8px);
    z-index: 10000;
    display: none;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.3s ease;
}

.chat-modal-overlay.open {
    display: flex;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        backdrop-filter: blur(0px);
    }
    to {
        opacity: 1;
        backdrop-filter: blur(8px);
    }
}

.chat-modal {
    width: 400px;
    height: 560px;
    max-width: 95vw;
    max-height: 90vh;
    background: linear-gradient(135deg, #ADA9E8, #434361, #00D4FF);
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    overflow: hidden;
    animation: slideUp 0.35s ease;
    display: flex;
    flex-direction: column;
    position: relative;
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(40px) scale(0.95);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.chat-modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: rgba(0, 0, 0, 0.15);
    flex-shrink: 0;
}

.chat-modal-header h2 {
    font-size: 1rem;
    color: white;
    margin: 0;
    font-weight: 600;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
}

.chat-modal-close {
    background: none;
    border: none;
    color: white;
    font-size: 1.6rem;
    cursor: pointer;
    padding: 0 8px;
    opacity: 0.8;
    transition: opacity 0.3s ease;
    line-height: 1;
}

.chat-modal-close:hover {
    opacity: 1;
    transform: rotate(90deg);
}

.chat-modal-body {
    flex: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 0;
}

.chat-modal-body iframe {
    width: 100%;
    height: 100%;
    border: none;
    background: transparent;
}

/* Loading State */
.chat-loading {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(6px);
}

.chat-loading .spinner {
    width: 40px;
    height: 40px;
    border: 4px solid rgba(255, 255, 255, 0.2);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.chat-loading p {
    color: rgba(255, 255, 255, 0.8);
    font-size: 0.9rem;
    margin: 0;
}

/* Mobile Responsive */
@media (max-width: 480px) {
    #chat-fab-container {
        bottom: 20px;
        right: 20px;
    }
    
    .chat-fab {
        width: 52px;
        height: 52px;
    }
    
    .chat-fab i {
        font-size: 22px;
    }
    
    .chat-modal {
        width: 98vw;
        height: 92vh;
        max-height: 92vh;
        border-radius: 16px;
    }
    
    .chat-modal-header {
        padding: 10px 14px;
    }
    
    .chat-modal-header h2 {
        font-size: 0.9rem;
    }
    
    .chat-modal-close {
        font-size: 1.4rem;
    }
}

@media (max-width: 768px) {
    .chat-modal {
        width: 95vw;
        height: 85vh;
    }
}

    </style>
</head>
<body>
    <div id="chat-widget-container">
        <!-- Header -->
        <nav>
            <h1>💬 KISAN CIRCLE</h1>
            <div id="user-count-container">
                <span id="user-count-dot"></span>
                <span id="user-count-text">0 Online</span>
            </div>
            <button id="chat-widget-close" onclick="window.close()">&times;</button>
        </nav>

        <!-- Messages Area -->
        <div class="container active" id="messageContainer"></div>

        <!-- Typing Indicator -->
        <div id="typing-indicator"></div>

        <!-- Message Input Area -->
        <div class="send active" id="chat-input-area">
            <input type="file" id="image-input" accept="image/*" style="display: none;">
            <form id="send-container">
                <button type="button" class="btn-icon" id="attach-file-btn">
                    <i class="fa-solid fa-paperclip"></i>
                </button>
                <input type="text" name="messageimp" id="messageimp" placeholder="Type a message..." autocomplete="off">
                <button class="btn" type="submit" id="send-btn">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
                <button type="button" class="btn" id="record-btn" style="display: none;">
                    <i class="fa-solid fa-microphone"></i>
                </button>
            </form>
        </div>
    </div>
<!-- Chat Button - Fixed at Bottom Right -->
<div id="chat-fab-container">
    <button id="chat-fab" class="chat-fab" onclick="toggleChat()">
        <i class="fas fa-comment-dots"></i>
        <span class="chat-notification" id="chatNotification">1</span>
    </button>
</div>

<!-- Chat Modal Overlay -->
<div id="chat-modal-overlay" class="chat-modal-overlay" onclick="closeChat(event)">
    <div id="chat-modal" class="chat-modal" onclick="event.stopPropagation()">
        <!-- Chat content will be loaded here -->
        <div id="chat-modal-content">
            <!-- Loading spinner -->
            <div class="chat-loading">
                <div class="spinner"></div>
                <p>Loading chat...</p>
            </div>
        </div>
    </div>
</div>
    <!-- Load Socket.IO -->
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    
    <script>
        // Check if user is logged in
        function getCurrentUser() {
            try {
                const keys = ['agriUser', 'user', 'userData', 'authUser'];
                for (const key of keys) {
                    const data = localStorage.getItem(key);
                    if (data) {
                        try {
                            const user = JSON.parse(data);
                            const userId = user.id || user.user_id || user.userId || user._id || null;
                            if (userId) {
                                return {
                                    id: parseInt(userId),
                                    email: user.email || null,
                                    name: user.name || user.username || 'User'
                                };
                            }
                        } catch (e) {}
                    }
                }
                return null;
            } catch (error) {
                return null;
            }
        }
        
        // If not logged in, show login prompt
        const user = getCurrentUser();
        if (!user) {
            document.getElementById('chat-widget-container').innerHTML = `
                <nav>
                    <h1>🔐 KISAN CIRCLE</h1>
                    <button id="chat-widget-close" onclick="window.close()">&times;</button>
                </nav>
                <div id="login-required">
                    <div class="login-box">
                        <h2>🔐 Login Required</h2>
                        <p>Please login to join the group chat</p>
                        <a href="/login.html?redirect=/chat.html" class="login-btn">
                            <i class="fa-solid fa-arrow-right-to-bracket"></i> Login
                        </a>
                    </div>
                </div>
            `;
        } else {
            // User is logged in, load the chat
            console.log('✅ User logged in:', user);
            // Load chat.js dynamically
            const script = document.createElement('script');
            script.src = '/js/chat.js';
            document.body.appendChild(script);
        }



        
    </script>
</body>
</html>
