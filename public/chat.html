<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KISAN CIRCLE Chat</title>
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    
    <!-- Chat CSS -->
    <link rel="stylesheet" href="/css/chat.css" />
    
    <style>
        /* Additional styles to ensure chat widget works */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: #f5f5f5;
        }
        
        /* Hide the default chat widget container initially */
        #chat-widget-container {
            display: none;
        }
        
        #chat-widget-container.active {
            display: flex;
        }
        
        /* Chat launcher button */
        #chat-launcher {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #6C4DFF, #8B5CFF);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(108, 77, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            transition: all 0.3s ease;
            border: none;
            color: white;
        }
        
        #chat-launcher:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 30px rgba(108, 77, 255, 0.5);
        }
        
        #chat-launcher i {
            font-size: 28px;
        }
        
        /* Unread badge */
        #chat-unread-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            width: 24px;
            height: 24px;
            background-color: #F44336;
            color: white;
            font-size: 12px;
            font-weight: 700;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
        }
        
        /* User count dot */
        #user-count-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
            background-color: #ffaa00;
        }
        
        #user-count-dot.online {
            background-color: #32CD32;
        }
        
        #user-count-dot.offline {
            background-color: #ff4444;
        }
        
        /* Typing indicator */
        #typing-indicator {
            height: 24px;
            padding: 0 15px 5px 15px;
            font-size: 0.85rem;
            font-style: italic;
            color: rgba(255, 255, 255, 0.9);
            background: transparent;
            min-height: 24px;
        }
        
        /* Message container */
        .container {
            width: auto;
            max-width: 100%;
            height: 400px;
            background-color: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            margin: 0;
            padding: 10px;
            border-radius: 0;
            overflow-y: auto;
            box-shadow: none;
            display: flex;
            flex-direction: column;
        }
        
        .container.active {
            display: flex;
        }
        
        .container::-webkit-scrollbar {
            width: 6px;
        }
        
        .container::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 6px;
        }
        
        /* Message bubbles */
        .message {
            max-width: 80%;
            padding: 0;
            margin: 5px;
            border-radius: 15px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
            clear: both;
            box-shadow: 0 1px 2px rgba(0,0,0,0.08);
        }
        
        .message.right {
            background-color: #DCF8C6;
            color: #333;
            float: right;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        
        .message.left {
            background-color: #F1F0F0;
            color: #333;
            float: left;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        
        .message-body {
            padding: 10px 15px 4px 15px;
            font-size: 0.95rem;
        }
        
        .message-header {
            padding: 0 15px 8px 15px;
            display: flex;
            justify-content: flex-end;
        }
        
        .message-info {
            font-size: 0.7rem;
            color: #888;
            opacity: 0.7;
        }
        
        .message.right .message-header {
            display: none;
        }
        
        .message.right .message-body {
            padding-bottom: 10px;
        }
        
        /* Image in chat */
        .message-image {
            max-width: 250px;
            width: 100%;
            border-radius: 10px;
            margin-top: 5px;
            cursor: pointer;
        }
        
        /* Audio in chat */
        .message-body audio {
            width: 100%;
            min-width: 200px;
            height: 40px;
        }
        
        /* Send area */
        .send {
            width: auto;
            max-width: 100%;
            display: none;
            margin: 0;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.9);
            flex-shrink: 0;
        }
        
        .send.active {
            display: block;
        }
        
        #send-container {
            display: flex;
            align-items: center;
            width: 100%;
            gap: 8px;
        }
        
        #messageimp {
            flex: 1;
            padding: 10px 15px;
            font-size: 14px;
            border-radius: 20px;
            border: 1px solid #ccc;
            outline: none;
            font-family: 'Poppins', sans-serif;
        }
        
        #messageimp:focus {
            border-color: #6C4DFF;
        }
        
        .btn-icon {
            background: none;
            border: none;
            font-size: 1.2rem;
            color: #555;
            cursor: pointer;
            padding: 0 10px;
            transition: color 0.2s ease;
        }
        
        .btn-icon:hover {
            color: #6C4DFF;
        }
        
        .btn {
            padding: 0;
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #6C4DFF, #8B5CFF);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(108, 77, 255, 0.3);
        }
        
        .btn i {
            font-size: 16px;
        }
        
        /* Recording animation */
        @keyframes pulse-record {
            0% { box-shadow: 0 0 0 0 rgba(244, 67, 54, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(244, 67, 54, 0); }
            100% { box-shadow: 0 0 0 0 rgba(244, 67, 54, 0); }
        }
        
        #record-btn.recording {
            background-color: #F44336;
            animation: pulse-record 1.5s infinite;
        }
        
        /* Chat widget container */
        #chat-widget-container {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 380px;
            max-height: 80vh;
            background: linear-gradient(135deg, #ADA9E8, #434361, #00D4FF);
            border-radius: 16px;
            box-shadow: 0 5px 30px rgba(0,0,0,0.3);
            display: none;
            flex-direction: column;
            overflow: hidden;
            transform: translateY(20px);
            opacity: 0;
            transition: all 0.3s ease-in-out;
            z-index: 1000;
        }
        
        #chat-widget-container.active {
            display: flex;
            transform: translateY(0);
            opacity: 1;
        }
        
        /* Header */
        #chat-widget-container nav {
            display: flex;
            align-items: center;
            background: rgba(0,0,0,0.15);
            padding: 10px 15px;
            justify-content: space-between;
            flex-shrink: 0;
        }
        
        #chat-widget-container h1 {
            font-size: 1.1rem;
            margin: 0;
            flex: 1;
            color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
            font-weight: 600;
        }
        
        #user-count-container {
            display: flex;
            align-items: center;
            margin-right: 10px;
            padding: 3px 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
        }
        
        #user-count-text {
            font-size: 0.8rem;
            font-weight: 600;
            color: white;
            white-space: nowrap;
        }
        
        #chat-widget-close {
            background: none;
            border: none;
            font-size: 1.8rem;
            line-height: 1;
            color: white;
            cursor: pointer;
            padding: 0 5px;
            opacity: 0.7;
            transition: opacity 0.3s ease;
        }
        
        #chat-widget-close:hover {
            opacity: 1;
        }
        
        /* Login prompt modal */
        #join-modal {
            background: white;
            color: #333;
            padding: 30px;
            text-align: center;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #join-box h2 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 1.25rem;
            color: #333;
        }
        
        #join-box p {
            margin: 0 0 15px 0;
            font-size: 0.9rem;
            color: #666;
        }
        
        /* Responsive */
        @media (max-width: 480px) {
            #chat-widget-container {
                width: 95vw;
                max-height: 90vh;
                right: 2.5vw;
                bottom: 80px;
            }
            
            #chat-launcher {
                width: 55px;
                height: 55px;
                bottom: 15px;
                right: 15px;
            }
            
            #chat-launcher i {
                font-size: 24px;
            }
            
            .container {
                height: 350px;
            }
        }
    </style>
</head>
<body>
    
    <!-- Load Socket.IO client -->
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    
    <!-- Load Chat JavaScript -->
    <script src="/js/chat.js"></script>
    
</body>
</html>
