<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scheme Details - AgriConnect Hub</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    :root {
        --primary: #10b981;
        --primary-soft: #ecfdf5;
        --dark: #0f172a;
        --slate: #64748b;
        --bg: #f8fafc;
        --white: #ffffff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: var(--bg);
        color: var(--dark);
        line-height: 1.4; /* Tighter line height to save space */
    }

    header {
        background: #064e3b;
        padding: 12px 8%; /* Reduced header padding */
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: #fff;
    }

    header a { color: #fff; text-decoration: none; font-weight: 800; display: flex; align-items: center; gap: 8px; font-size: 14px; }

    main { display: flex; justify-content: center; padding: 20px 10px; } /* Smaller main padding */

    /* Compact Card Styling */
    .card {
        background: var(--white);
        width: 100%;
        max-width: 480px; /* Reduced width to make it feel smaller */
        border-radius: 24px;
        padding: 24px; /* Reduced card padding */
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }

    .badge {
        display: inline-block;
        background: var(--primary-soft);
        color: var(--primary);
        padding: 4px 10px;
        border-radius: 99px;
        font-size: 10px; /* Smaller badge */
        font-weight: 800;
        margin-bottom: 12px;
        text-transform: uppercase;
    }

    h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 16px; color: var(--dark); } /* Smaller Title */

    .section { margin-bottom: 20px; } /* Reduced section spacing */

    .section h4 {
        font-size: 10px;
        text-transform: uppercase;
        color: var(--slate);
        margin-bottom: 10px;
        letter-spacing: 0.05em;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .content-box {
        background-color: #f9fbfb;
        border-radius: 16px;
        padding: 16px; /* Tighter content box */
    }

    .list-item {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
        font-weight: 600;
        font-size: 13px; /* Smaller list text */
    }

    .list-item i { color: var(--primary); font-size: 14px; }

    .step-item {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 10px;
    }

    .step-number {
        width: 22px;
        height: 22px;
        background: var(--primary);
        color: white;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        font-weight: 800;
        flex-shrink: 0;
    }

    .btn {
        padding: 12px;
        border-radius: 12px;
        font-weight: 800;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        text-decoration: none;
        border: none;
        cursor: pointer;
        font-size: 14px;
    }

    .btn-apply { background: var(--primary); color: white; margin-bottom: 10px; width: 100%; }
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-pdf { background: #0f172a; color: white; }
    .btn-help { background: #f1f5f9; color: var(--slate); }

    .back-link {
        display: block;
        text-align: center;
        margin-top: 16px;
        color: var(--slate);
        text-decoration: none;
        font-weight: 700;
        font-size: 12px;
    }

    /* Support Modal Styling */
    .modal-overlay {
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px); z-index: 2000;
        align-items: center; justify-content: center;
    }
    .modal-content {
        background: white; padding: 24px; border-radius: 24px; width: 90%;
        max-width: 360px; position: relative; text-align: center;
    }
</style>
</head>
<body>

<header>
    <a href="agri2.html"><i class="fas fa-leaf"></i> AgriConnect Hub</a>
    <a href="agri2.html"><i class="fas fa-home"></i> Home</a>
</header>

<main>
    <div class="card" id="schemeCard">
        <p style="text-align:center; font-size: 14px;">Loading...</p>
    </div>
</main>

<div id="helpModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <i class="fas fa-headset" style="font-size: 32px; color: var(--primary); margin-bottom: 12px;"></i>
            <h3 style="font-size: 18px; font-weight: 800; margin-bottom: 4px;">Support Desk</h3>
            <p style="color: var(--slate); font-size: 12px; margin-bottom: 16px;">Our coordinators are here to help you.</p>
        </div>
        <div style="background: #f9fbfb; padding: 12px; border-radius: 12px; display: flex; align-items: center; gap: 12px; margin-bottom: 8px; text-align: left;">
            <i class="fas fa-phone-alt" style="color: var(--primary);"></i>
            <div>
                <div style="font-size: 8px; text-transform: uppercase; color: var(--slate); font-weight: 800;">Status</div>
                <div style="font-weight: 800; color: var(--dark); font-size: 14px;" id="modalNumber">Online</div>
            </div>
        </div>
        <div style="background: #f9fbfb; padding: 12px; border-radius: 12px; display: flex; align-items: center; gap: 12px; margin-bottom: 16px; text-align: left;">
            <i class="fab fa-whatsapp" style="color: var(--primary);"></i>
            <div>
                <div style="font-size: 8px; text-transform: uppercase; color: var(--slate); font-weight: 800;">WhatsApp</div>
                <div style="font-weight: 800; color: var(--dark); font-size: 14px;"><a href="#" id="modalWhatsApp" target="_blank" style="text-decoration:none; color:inherit;">Chat Now</a></div>
            </div>
        </div>
        <button onclick="closeHelpModal()" class="btn btn-apply">Close</button>
    </div>
</div>

<script>
let currentLink = "";
let currentDisplayNum = "";

function showHelpModal() {
    document.getElementById('modalWhatsApp').href = currentLink;
    document.getElementById('modalNumber').innerText = currentDisplayNum;
    document.getElementById('helpModal').style.display = 'flex';
}

function closeHelpModal() { document.getElementById('helpModal').style.display = 'none'; }

document.addEventListener("DOMContentLoaded", async () => {
    const params = new URLSearchParams(window.location.search);
    const schemeId = params.get("id");
    const card = document.getElementById("schemeCard");

    try {
        const res = await fetch("http://localhost:3000/api/schemes");
        const schemes = await res.json();
        const scheme = schemes.find(s => s.id == schemeId);

        if (scheme) {
            currentLink = scheme.help_link || "https://wa.me/918097627902";
            currentDisplayNum = currentLink.includes("wa.me/") ? "+" + currentLink.split("wa.me/")[1] : "Online";

            const docs = scheme.documents ? scheme.documents.split(",") : [];
            const steps = scheme.roadmap ? scheme.roadmap.split(",") : [];

            card.innerHTML = `
                <span class="badge">${scheme.category} | ${scheme.state || "Central"}</span>
                <h1>${scheme.name}</h1>

                <div class="section">
                    <h4><i class="fas fa-info-circle"></i> Description</h4>
                    <p style="color:var(--slate); font-size: 13px; font-weight:500;">${scheme.description}</p>
                </div>

                <div class="section">
                    <h4><i class="fas fa-clipboard-check"></i> Documents</h4>
                    <div class="content-box">
                        ${docs.map(d => `<div class="list-item"><i class="fas fa-check-circle"></i> ${d.trim()}</div>`).join("")}
                    </div>
                </div>

                <div class="section">
                    <h4><i class="fas fa-route"></i> Process</h4>
                    <div class="content-box">
                        ${steps.map((s, i) => `
                            <div class="step-item">
                                <div class="step-number">${i + 1}</div>
                                <div style="font-weight:600; font-size: 13px;">${s.trim()}</div>
                            </div>
                        `).join("")}
                    </div>
                </div>

                <a href="${scheme.link}" target="_blank" class="btn btn-apply">
                    <i class="fas fa-external-link-alt"></i> Apply Now
                </a>

                <div class="btn-row">
                    <button onclick="window.print()" class="btn btn-pdf"><i class="fas fa-file-pdf"></i> PDF</button>
                    <button onclick="showHelpModal()" class="btn btn-help"><i class="fas fa-question-circle"></i> Help</button>
                </div>

                <a href="javascript:history.back()" class="back-link">← Marketplace</a>
            `;
        }
    } catch (err) { card.innerHTML = "<p>Error loading scheme.</p>"; }
});
</script>
</body>
</html>
