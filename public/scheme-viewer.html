<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scheme Details - AgriConnect Hub</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    :root {
        --primary: #10b981;
        --primary-dark: #059669;
        --primary-soft: #ecfdf5;
        --dark: #0f172a;
        --slate: #64748b;
        --slate-light: #94a3b8;
        --bg: #f1f5f9;
        --white: #ffffff;
        --shadow: 0 20px 60px -12px rgba(0, 0, 0, 0.15);
        --radius: 24px;
        --radius-sm: 12px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background: var(--bg);
        color: var(--dark);
        line-height: 1.6;
        min-height: 100vh;
    }

    /* ===== HEADER ===== */
    header {
        background: #064e3b;
        padding: 14px 6%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: #fff;
        position: sticky;
        top: 0;
        z-index: 100;
        box-shadow: 0 2px 20px rgba(0,0,0,0.1);
    }

    header a {
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 1rem;
        transition: opacity 0.2s;
    }
    
    header a:hover { opacity: 0.8; }
    
    .logo-icon {
        background: var(--primary);
        padding: 6px 10px;
        border-radius: 8px;
        font-size: 1.1rem;
    }

    .nav-home {
        background: rgba(255,255,255,0.12);
        padding: 6px 16px;
        border-radius: 40px;
        font-size: 0.85rem;
        transition: 0.2s;
    }
    .nav-home:hover { background: var(--primary); color: #064e3b; }

    /* ===== MAIN LAYOUT ===== */
    main {
        max-width: 1000px;
        margin: 0 auto;
        padding: 30px 20px 60px;
        width: 90%;
    }

    /* ===== BACK BUTTON ===== */
    .back-nav {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
    }
    
    .back-nav a {
        color: var(--slate);
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        gap: 6px;
        transition: 0.2s;
    }
    
    .back-nav a:hover {
        color: var(--primary);
        transform: translateX(-4px);
    }

    /* ===== MAIN CARD ===== */
    .scheme-card {
        background: var(--white);
        border-radius: var(--radius);
        padding: 40px 44px;
        box-shadow: var(--shadow);
        border: 1px solid rgba(0,0,0,0.04);
    }

    /* ===== BADGE ===== */
    .badge-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 16px;
    }

    .badge {
        display: inline-block;
        padding: 4px 14px;
        border-radius: 99px;
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    
    .badge-category {
        background: var(--primary-soft);
        color: var(--primary-dark);
    }
    
    .badge-state {
        background: #f1f5f9;
        color: var(--slate);
    }

    /* ===== TITLE ===== */
    .scheme-title {
        font-size: 2rem;
        font-weight: 800;
        color: var(--dark);
        margin-bottom: 8px;
        line-height: 1.2;
    }

    .scheme-subtitle {
        color: var(--slate);
        font-size: 0.95rem;
        margin-bottom: 28px;
        padding-bottom: 20px;
        border-bottom: 2px solid var(--bg);
    }

    /* ===== SECTIONS ===== */
    .section {
        margin-bottom: 28px;
    }

    .section:last-of-type { margin-bottom: 32px; }

    .section-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
    }

    .section-header i {
        font-size: 1.1rem;
        color: var(--primary);
        width: 28px;
        height: 28px;
        background: var(--primary-soft);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }

    .section-header h4 {
        font-size: 0.85rem;
        font-weight: 700;
        color: var(--slate);
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .section-content {
        background: var(--bg);
        border-radius: var(--radius-sm);
        padding: 18px 20px;
    }

    .section-content p {
        font-size: 0.95rem;
        color: var(--dark);
        line-height: 1.7;
    }

    /* ===== DOCUMENT LIST ===== */
    .doc-list {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
    }

    .doc-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        background: var(--white);
        border-radius: 8px;
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--dark);
        border: 1px solid #e2e8f0;
        transition: 0.2s;
    }
    
    .doc-item:hover {
        border-color: var(--primary);
        background: var(--primary-soft);
    }

    .doc-item i {
        color: var(--primary);
        font-size: 0.9rem;
    }

    /* ===== PROCESS STEPS ===== */
    .step-item {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        padding: 10px 0;
        border-bottom: 1px solid #e2e8f0;
    }

    .step-item:last-child {
        border-bottom: none;
        padding-bottom: 0;
    }

    .step-number {
        width: 28px;
        height: 28px;
        background: var(--primary);
        color: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.75rem;
        font-weight: 800;
        flex-shrink: 0;
        margin-top: 2px;
    }

    .step-text {
        font-size: 0.9rem;
        font-weight: 500;
        color: var(--dark);
        padding-top: 2px;
        line-height: 1.5;
    }

    /* ===== BUTTONS ===== */
    .btn-group {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 8px;
    }

    .btn {
        padding: 12px 28px;
        border-radius: var(--radius-sm);
        font-weight: 700;
        font-size: 0.9rem;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        border: none;
        cursor: pointer;
        transition: all 0.2s ease;
        flex: 1;
        justify-content: center;
        min-width: 140px;
    }

    .btn-primary {
        background: var(--primary);
        color: white;
        box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .btn-primary:hover {
        background: var(--primary-dark);
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(16, 185, 129, 0.4);
    }

    .btn-secondary {
        background: #f1f5f9;
        color: var(--slate);
    }

    .btn-secondary:hover {
        background: #e2e8f0;
        color: var(--dark);
    }

    .btn-dark {
        background: var(--dark);
        color: white;
    }

    .btn-dark:hover {
        background: #1e293b;
        transform: translateY(-2px);
    }

    .btn-outline {
        background: transparent;
        color: var(--slate);
        border: 2px solid #e2e8f0;
    }

    .btn-outline:hover {
        border-color: var(--primary);
        color: var(--primary);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
        main { width: 96%; padding: 16px 10px 40px; }
        .scheme-card { padding: 24px 20px; border-radius: 18px; }
        .scheme-title { font-size: 1.4rem; }
        .doc-list { grid-template-columns: 1fr; }
        .btn-group { flex-direction: column; }
        .btn { flex: none; width: 100%; justify-content: center; }
        .back-nav { margin-bottom: 16px; }
        .section-content { padding: 14px 16px; }
        header { padding: 10px 4%; }
        header a { font-size: 0.85rem; }
        .logo-icon { font-size: 0.9rem; padding: 4px 8px; }
    }

    @media (max-width: 480px) {
        .scheme-card { padding: 18px 14px; }
        .scheme-title { font-size: 1.2rem; }
        .section-header h4 { font-size: 0.75rem; }
        .step-text { font-size: 0.8rem; }
        .badge { font-size: 0.6rem; padding: 3px 10px; }
        .section-content p { font-size: 0.85rem; }
        .btn { font-size: 0.8rem; padding: 10px 20px; }
    }

    @media (min-width: 769px) {
        main { width: 80%; max-width: 900px; }
    }

    /* ===== MODAL ===== */
    .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(15, 23, 42, 0.5);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        z-index: 2000;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .modal-overlay.active {
        display: flex;
    }

    .modal-content {
        background: white;
        padding: 32px;
        border-radius: var(--radius);
        width: 100%;
        max-width: 400px;
        position: relative;
        text-align: center;
        box-shadow: 0 30px 60px rgba(0,0,0,0.2);
        animation: modalSlide 0.3s ease;
    }

    @keyframes modalSlide {
        from { opacity: 0; transform: translateY(20px) scale(0.95); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .modal-header i {
        font-size: 40px;
        color: var(--primary);
        margin-bottom: 12px;
        display: block;
    }

    .modal-header h3 {
        font-size: 1.2rem;
        font-weight: 800;
        margin-bottom: 4px;
    }

    .modal-header p {
        color: var(--slate);
        font-size: 0.85rem;
        margin-bottom: 20px;
    }

    .modal-contact {
        background: var(--bg);
        padding: 14px 16px;
        border-radius: var(--radius-sm);
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 10px;
        text-align: left;
    }

    .modal-contact i {
        font-size: 1.1rem;
        color: var(--primary);
        width: 20px;
        text-align: center;
    }

    .modal-contact .label {
        font-size: 0.6rem;
        text-transform: uppercase;
        color: var(--slate);
        font-weight: 700;
        letter-spacing: 0.5px;
    }

    .modal-contact .value {
        font-weight: 700;
        color: var(--dark);
        font-size: 0.9rem;
    }

    .modal-contact .value a {
        text-decoration: none;
        color: var(--dark);
    }

    .modal-contact .value a:hover {
        color: var(--primary);
    }

    .modal .btn {
        width: 100%;
        justify-content: center;
        margin-top: 4px;
    }

    /* ===== LOADING ===== */
    .loading-state {
        text-align: center;
        padding: 40px 20px;
    }

    .loading-spinner {
        width: 40px;
        height: 40px;
        border: 4px solid var(--bg);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    .loading-state p {
        color: var(--slate);
        font-size: 0.9rem;
    }
</style>
</head>
<body>

<header>
    <a href="agri2.html">
        <span class="logo-icon"><i class="fas fa-leaf"></i></span>
        AgriConnect Hub
    </a>
    <a href="agri2.html" class="nav-home"><i class="fas fa-home"></i> Home</a>
</header>

<main>
    <!-- Back Navigation -->
    <div class="back-nav">
        <a href="javascript:history.back()">
            <i class="fas fa-arrow-left"></i> Back to Schemes
        </a>
    </div>

    <!-- Scheme Card -->
    <div class="scheme-card" id="schemeCard">
        <div class="loading-state">
            <div class="loading-spinner"></div>
            <p>Loading scheme details...</p>
        </div>
    </div>
</main>

<!-- Help Modal -->
<div id="helpModal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <i class="fas fa-headset"></i>
            <h3>Support Desk</h3>
            <p>Our coordinators are here to help you.</p>
        </div>
        <div class="modal-contact">
            <i class="fas fa-phone-alt"></i>
            <div>
                <div class="label">Status</div>
                <div class="value" id="modalNumber">Online</div>
            </div>
        </div>
        <div class="modal-contact">
            <i class="fab fa-whatsapp"></i>
            <div>
                <div class="label">WhatsApp</div>
                <div class="value"><a href="#" id="modalWhatsApp" target="_blank">Chat Now</a></div>
            </div>
        </div>
        <button onclick="closeHelpModal()" class="btn btn-primary">Close</button>
    </div>
</div>

<script>
let currentLink = "";
let currentDisplayNum = "";

function showHelpModal() {
    document.getElementById('modalWhatsApp').href = currentLink;
    document.getElementById('modalNumber').innerText = currentDisplayNum;
    document.getElementById('helpModal').classList.add('active');
}

function closeHelpModal() {
    document.getElementById('helpModal').classList.remove('active');
}

// Close modal on overlay click
document.getElementById('helpModal').addEventListener('click', function(e) {
    if (e.target === this) closeHelpModal();
});

// ===== DYNAMIC API URL DETECTION =====
function getApiUrl() {
    const hostname = window.location.hostname;
    if (hostname === 'agri-connect-2kik.onrender.com') {
        return window.location.origin + '/api';
    }
    if (hostname === 'localhost' || hostname === '127.0.0.1') {
        return 'http://localhost:3000/api';
    }
    return '/api';
}

const API_BASE_URL = getApiUrl();
console.log(`🔗 Scheme Viewer API URL: ${API_BASE_URL}`);

// ===== ESCAPE HTML =====
function escapeHtml(str) {
    if (!str) return '';
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

// ===== MAIN =====
document.addEventListener("DOMContentLoaded", async () => {
    const params = new URLSearchParams(window.location.search);
    const schemeId = params.get("id");
    const card = document.getElementById("schemeCard");

    if (!schemeId) {
        card.innerHTML = `
            <div style="text-align:center; padding:30px 20px;">
                <i class="fas fa-exclamation-circle" style="font-size:32px; color:#dc2626; margin-bottom:12px;"></i>
                <h3 style="color:#dc2626;">No Scheme ID Provided</h3>
                <p style="color:var(--slate);">Please select a scheme from the marketplace.</p>
                <a href="agri2.html#schemes" class="btn btn-primary" style="margin-top:16px; display:inline-flex;">Browse Schemes</a>
            </div>
        `;
        return;
    }

    try {
        console.log(`📡 Fetching scheme ID: ${schemeId} from ${API_BASE_URL}/schemes`);
        const res = await fetch(`${API_BASE_URL}/schemes`, {
            method: 'GET',
            headers: {
                'Accept': 'application/json',
                'Content-Type': 'application/json'
            }
        });
        
        if (!res.ok) {
            throw new Error(`HTTP error! status: ${res.status}`);
        }
        
        const schemes = await res.json();
        console.log(`📚 Loaded ${schemes.length} schemes`);
        
        const scheme = schemes.find(s => s.id == schemeId);

        if (scheme) {
            currentLink = scheme.help_link || "https://wa.me/918097627902";
            currentDisplayNum = currentLink.includes("wa.me/") ? "+" + currentLink.split("wa.me/")[1] : "Online";

            const docs = scheme.documents ? scheme.documents.split(",").filter(d => d.trim()) : [];
            const steps = scheme.roadmap ? scheme.roadmap.split(",").filter(s => s.trim()) : [];

            card.innerHTML = `
                <!-- Badges -->
                <div class="badge-row">
                    <span class="badge badge-category"><i class="fas fa-tag"></i> ${escapeHtml(scheme.category || 'General')}</span>
                    <span class="badge badge-state"><i class="fas fa-map-marker-alt"></i> ${escapeHtml(scheme.state || 'Central')}</span>
                </div>

                <!-- Title -->
                <h1 class="scheme-title">${escapeHtml(scheme.name)}</h1>
                <p class="scheme-subtitle">
                    <i class="fas fa-id-card" style="color:var(--primary);"></i> Scheme ID: #${scheme.id}
                </p>

                <!-- Description -->
                <div class="section">
                    <div class="section-header">
                        <i class="fas fa-info-circle"></i>
                        <h4>Description</h4>
                    </div>
                    <div class="section-content">
                        <p>${escapeHtml(scheme.description || 'No description available for this scheme.')}</p>
                    </div>
                </div>

                <!-- Eligibility -->
                ${scheme.eligibility ? `
                <div class="section">
                    <div class="section-header">
                        <i class="fas fa-check-circle"></i>
                        <h4>Eligibility Criteria</h4>
                    </div>
                    <div class="section-content">
                        <p>${escapeHtml(scheme.eligibility)}</p>
                    </div>
                </div>` : ''}

                <!-- Documents -->
                <div class="section">
                    <div class="section-header">
                        <i class="fas fa-file-alt"></i>
                        <h4>Required Documents</h4>
                    </div>
                    <div class="section-content">
                        ${docs.length > 0 ? `
                        <div class="doc-list">
                            ${docs.map(d => `<div class="doc-item"><i class="fas fa-check-circle"></i> ${escapeHtml(d.trim())}</div>`).join('')}
                        </div>` : `
                        <p style="color:var(--slate); font-size:0.85rem;">No specific documents listed. Please check with the official source.</p>`}
                    </div>
                </div>

                <!-- Process -->
                <div class="section">
                    <div class="section-header">
                        <i class="fas fa-route"></i>
                        <h4>Application Process</h4>
                    </div>
                    <div class="section-content">
                        ${steps.length > 0 ? steps.map((s, i) => `
                            <div class="step-item">
                                <div class="step-number">${i + 1}</div>
                                <div class="step-text">${escapeHtml(s.trim())}</div>
                            </div>
                        `).join('') : `
                        <p style="color:var(--slate); font-size:0.85rem;">No process steps available. Visit the official website for details.</p>`}
                    </div>
                </div>

                <!-- Buttons -->
                <div class="btn-group">
                    <a href="${scheme.link || '#'}" target="_blank" class="btn btn-primary" ${!scheme.link ? 'style="opacity:0.5; pointer-events:none;"' : ''}>
                        <i class="fas fa-external-link-alt"></i> Apply Now
                    </a>
                    <button onclick="window.print()" class="btn btn-dark">
                        <i class="fas fa-print"></i> Print
                    </button>
                    <button onclick="showHelpModal()" class="btn btn-outline">
                        <i class="fas fa-question-circle"></i> Help
                    </button>
                </div>
            `;
        } else {
            card.innerHTML = `
                <div style="text-align:center; padding:30px 20px;">
                    <i class="fas fa-search" style="font-size:32px; color:var(--slate-light); margin-bottom:12px;"></i>
                    <h3 style="color:var(--dark);">Scheme Not Found</h3>
                    <p style="color:var(--slate);">The scheme you're looking for doesn't exist or has been removed.</p>
                    <a href="agri2.html#schemes" class="btn btn-primary" style="margin-top:16px; display:inline-flex;">
                        <i class="fas fa-arrow-left"></i> Browse All Schemes
                    </a>
                </div>
            `;
        }
    } catch (err) {
        console.error('❌ Error loading scheme:', err);
        card.innerHTML = `
            <div style="text-align:center; padding:30px 20px;">
                <i class="fas fa-exclamation-triangle" style="font-size:32px; color:#dc2626; margin-bottom:12px;"></i>
                <h3 style="color:#dc2626;">Error Loading Scheme</h3>
                <p style="color:var(--slate);">${escapeHtml(err.message || 'Please check your server connection.')}</p>
                <p style="color:var(--slate-light); font-size:0.75rem; margin-top:8px;">API URL: ${escapeHtml(API_BASE_URL)}</p>
                <button onclick="location.reload()" class="btn btn-primary" style="margin-top:16px; display:inline-flex;">
                    <i class="fas fa-sync-alt"></i> Retry
                </button>
            </div>
        `;
    }
});
</script>
</body>
</html>
