<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌾 Farmer Directory - AgriConnect</title>
    <!-- Font Awesome 6 (Free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            background: #f5f9f0;
            color: #1e2a1e;
            padding: 2rem 1.5rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
        }

        /* Header */
        .page-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            gap: 1rem;
        }

        .page-header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .page-header h1 i {
            color: #2b6e2b;
        }

        .header-stats {
            background: white;
            padding: 0.5rem 1.4rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 2px 8px rgba(0, 20, 0, 0.06);
            color: #1e4a1e;
        }

        .header-stats span {
            color: #0f3b0f;
            font-weight: 800;
        }

        /* Search & Filter Bar */
        .search-section {
            background: white;
            padding: 1.5rem 1.8rem;
            border-radius: 20px;
            box-shadow: 0 6px 18px rgba(0, 30, 0, 0.04);
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            margin-bottom: 2.5rem;
            border: 1px solid #e2eedb;
        }

        .search-box {
            flex: 2 1 280px;
            display: flex;
            align-items: center;
            background: #f2f8ef;
            border-radius: 50px;
            padding: 0 1.2rem;
            border: 1px solid #d4e4cc;
            transition: 0.2s;
        }

        .search-box:focus-within {
            border-color: #2f7a2f;
            box-shadow: 0 0 0 4px rgba(47, 122, 47, 0.12);
        }

        .search-box i {
            color: #3f6b3f;
            font-size: 1rem;
            margin-right: 0.7rem;
        }

        .search-box input {
            border: none;
            background: transparent;
            padding: 0.8rem 0;
            font-size: 1rem;
            width: 100%;
            outline: none;
            color: #1e2a1e;
        }

        .search-box input::placeholder {
            color: #6d8f6d;
            font-weight: 400;
        }

        .filter-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.8rem;
            flex: 1 1 220px;
        }

        .filter-group select {
            background: #f2f8ef;
            border: 1px solid #d4e4cc;
            border-radius: 40px;
            padding: 0.7rem 1.2rem;
            font-size: 0.95rem;
            font-weight: 500;
            color: #1f3a1f;
            cursor: pointer;
            outline: none;
            flex: 1 1 130px;
            transition: 0.15s;
        }

        .filter-group select:focus {
            border-color: #2f7a2f;
            box-shadow: 0 0 0 3px rgba(47, 122, 47, 0.10);
        }

        .clear-btn {
            background: transparent;
            border: none;
            color: #4d6b4d;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            padding: 0.4rem 0.8rem;
            border-radius: 30px;
            transition: 0.15s;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .clear-btn:hover {
            background: #eaf3e5;
            color: #174017;
        }

        /* Grid */
        .farmers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.8rem;
        }

        /* Card */
        .farmer-card {
            background: white;
            border-radius: 20px;
            padding: 1.5rem 1.3rem 1.6rem;
            box-shadow: 0 4px 16px rgba(0, 20, 0, 0.04);
            border: 1px solid #e6f0e0;
            transition: transform 0.15s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }

        .farmer-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(30, 70, 30, 0.08);
            border-color: #c2dbc2;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 0.8rem;
        }

        .avatar {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #d7e8d0;
            background: #eaf3e5;
            flex-shrink: 0;
        }

        .farm-name {
            font-size: 1.25rem;
            font-weight: 700;
            color: #173017;
            line-height: 1.2;
        }

        .farm-name small {
            font-weight: 400;
            font-size: 0.8rem;
            color: #4d6f4d;
            display: block;
            margin-top: 2px;
        }

        .crop-tag {
            display: inline-block;
            background: #e4f0de;
            color: #1f4a1f;
            font-size: 0.8rem;
            font-weight: 500;
            padding: 0.2rem 0.9rem;
            border-radius: 30px;
            margin: 0.3rem 0.25rem 0.3rem 0;
        }

        .detail-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.95rem;
            color: #2d462d;
            margin-top: 0.5rem;
        }

        .detail-row i {
            width: 1.1rem;
            color: #3d6b3d;
            font-size: 0.9rem;
        }

        .expert-badge {
            background: #f6e9b3;
            color: #7a6100;
            font-weight: 600;
            font-size: 0.7rem;
            padding: 0.15rem 0.7rem;
            border-radius: 30px;
            display: inline-flex;
            align-items: center;
            gap: 0.2rem;
            letter-spacing: 0.3px;
            margin-left: 0.4rem;
        }

        .card-footer {
            margin-top: 1.2rem;
            padding-top: 1rem;
            border-top: 1px solid #e9f2e4;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .contact-btn {
            background: #1f5a1f;
            color: white;
            border: none;
            padding: 0.55rem 1.4rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .contact-btn:hover {
            background: #134013;
            transform: scale(1.01);
            box-shadow: 0 4px 12px rgba(26, 80, 26, 0.2);
        }

        .exp-text {
            font-size: 0.85rem;
            color: #406040;
            background: #f0f7ec;
            padding: 0.25rem 0.9rem;
            border-radius: 30px;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 1rem;
            background: white;
            border-radius: 30px;
            color: #3d5e3d;
            font-size: 1.1rem;
            border: 1px dashed #c2d8c2;
        }

        .no-results i {
            font-size: 2.4rem;
            color: #7ba07b;
            display: block;
            margin-bottom: 0.8rem;
        }

        /* Loading */
        .loading-spinner {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem;
            color: #3d683d;
            font-size: 1.2rem;
        }

        .loading-spinner i {
            font-size: 2.2rem;
            margin-bottom: 0.6rem;
            display: block;
            color: #3a7a3a;
        }

        /* Responsive */
        @media (max-width: 640px) {
            body {
                padding: 1rem;
            }
            .page-header h1 {
                font-size: 1.6rem;
            }
            .search-section {
                padding: 1.2rem;
                flex-direction: column;
                align-items: stretch;
            }
            .filter-group {
                flex-wrap: wrap;
            }
            .filter-group select {
                flex: 1 1 100%;
            }
            .farmers-grid {
                grid-template-columns: 1fr;
            }
            .header-stats {
                font-size: 0.85rem;
                padding: 0.3rem 1rem;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- HEADER -->
    <div class="page-header">
        <h1><i class="fas fa-seedling"></i> Farmer Directory</h1>
        <div class="header-stats">
            <i class="fas fa-users" style="margin-right: 6px;"></i>
            <span id="farmerCount">0</span> registered farmers
        </div>
    </div>

    <!-- SEARCH & FILTER -->
    <div class="search-section">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search by name, crop, or location..." />
        </div>
        <div class="filter-group">
            <select id="cropFilter">
                <option value="">All Crops</option>
            </select>
            <select id="locationFilter">
                <option value="">All Locations</option>
            </select>
            <button class="clear-btn" id="clearFiltersBtn"><i class="fas fa-undo-alt"></i> Reset</button>
        </div>
    </div>

    <!-- GRID -->
    <div class="farmers-grid" id="farmersGrid">
        <div class="loading-spinner">
            <i class="fas fa-circle-notch fa-spin"></i>
            Loading farmers...
        </div>
    </div>

</div>

<script>
    (function() {
        'use strict';

        // DOM refs
        const grid = document.getElementById('farmersGrid');
        const searchInput = document.getElementById('searchInput');
        const cropFilter = document.getElementById('cropFilter');
        const locationFilter = document.getElementById('locationFilter');
        const clearBtn = document.getElementById('clearFiltersBtn');
        const farmerCountSpan = document.getElementById('farmerCount');

        // State
        let allFarmers = [];
        let filteredFarmers = [];

        // --- Fetch real farmers from your DB ---
        async function fetchFarmers() {
            try {
                // ✅ IMPORTANT: change this URL to your actual backend endpoint
                const response = await fetch('/api/approved-farmers', {
                    method: 'GET',
                    headers: { 'Cache-Control': 'no-cache' }
                });

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                const data = await response.json();

                // Expecting an array of farmer objects with fields:
                // farm_name, author_name, crop_specialization, farm_location,
                // years_experience, contact_number, email, profile_picture_url, etc.
                allFarmers = Array.isArray(data) ? data : [];

                // Populate filter dropdowns dynamically
                populateFilters(allFarmers);

                // Apply initial render
                applyFilters();

            } catch (err) {
                console.error('Failed to fetch farmers:', err);
                grid.innerHTML = `
                    <div class="no-results">
                        <i class="fas fa-exclamation-triangle"></i>
                        Unable to load farmers.<br />
                        <span style="font-size:0.9rem; color:#6e8b6e;">Please check your server connection.</span>
                    </div>
                `;
                farmerCountSpan.textContent = '0';
            }
        }

        // --- Populate crop & location dropdowns ---
        function populateFilters(farmers) {
            const cropsSet = new Set();
            const locationsSet = new Set();

            farmers.forEach(f => {
                if (f.crop_specialization) {
                    // Split by commas in case there are multiple crops
                    const crops = f.crop_specialization.split(',').map(c => c.trim()).filter(Boolean);
                    crops.forEach(c => cropsSet.add(c));
                }
                if (f.farm_location) {
                    locationsSet.add(f.farm_location.trim());
                }
            });

            // Crop filter
            cropFilter.innerHTML = '<option value="">All Crops</option>';
            [...cropsSet].sort().forEach(crop => {
                const opt = document.createElement('option');
                opt.value = crop;
                opt.textContent = crop;
                cropFilter.appendChild(opt);
            });

            // Location filter
            locationFilter.innerHTML = '<option value="">All Locations</option>';
            [...locationsSet].sort().forEach(loc => {
                const opt = document.createElement('option');
                opt.value = loc;
                opt.textContent = loc;
                locationFilter.appendChild(opt);
            });
        }

        // --- Filter & Render ---
        function applyFilters() {
            const searchTerm = searchInput.value.trim().toLowerCase();
            const cropVal = cropFilter.value.toLowerCase();
            const locVal = locationFilter.value.toLowerCase();

            filteredFarmers = allFarmers.filter(farmer => {
                // Search: name, farm name, crops, location
                const nameMatch = (farmer.author_name || '').toLowerCase().includes(searchTerm);
                const farmMatch = (farmer.farm_name || '').toLowerCase().includes(searchTerm);
                const cropMatch = (farmer.crop_specialization || '').toLowerCase().includes(searchTerm);
                const locMatch = (farmer.farm_location || '').toLowerCase().includes(searchTerm);
                const searchPass = searchTerm === '' || nameMatch || farmMatch || cropMatch || locMatch;

                // Crop filter (exact match on crop_specialization field)
                let cropPass = true;
                if (cropVal !== '') {
                    const farmerCrops = (farmer.crop_specialization || '').split(',').map(c => c.trim().toLowerCase());
                    cropPass = farmerCrops.includes(cropVal);
                }

                // Location filter
                const locationPass = locVal === '' || (farmer.farm_location || '').toLowerCase() === locVal;

                return searchPass && cropPass && locationPass;
            });

            renderFarmers(filteredFarmers);
            farmerCountSpan.textContent = filteredFarmers.length;
        }

        // --- Render cards ---
        function renderFarmers(farmers) {
            if (!farmers.length) {
                grid.innerHTML = `
                    <div class="no-results">
                        <i class="fas fa-tractor"></i>
                        No farmers match your filters.<br />
                        <span style="font-size:0.9rem; color:#6e8b6e;">Try adjusting your search criteria.</span>
                    </div>
                `;
                return;
            }

            let html = '';
            farmers.forEach(f => {
                // Profile picture fallback
                const avatar = f.profile_picture_url && f.profile_picture_url.startsWith('http')
                    ? f.profile_picture_url
                    : 'https://ui-avatars.com/api/?name=' + encodeURIComponent(f.author_name || f.farm_name || 'Farmer') + '&background=dce8d4&color=1f4a1f&size=58';

                // Format crops as tags
                let cropTags = '';
                if (f.crop_specialization) {
                    const crops = f.crop_specialization.split(',').map(c => c.trim()).filter(Boolean);
                    cropTags = crops.map(c => `<span class="crop-tag">${c}</span>`).join(' ');
                }

                // Expert badge if experience >= 7
                const exp = parseInt(f.years_experience) || 0;
                const expertBadge = exp >= 7 ? `<span class="expert-badge"><i class="fas fa-star" style="font-size:0.6rem;"></i> Expert</span>` : '';

                // Contact info for button
                const contactNumber = f.contact_number || '';
                const email = f.email || f.contact_email || '';

                html += `
                    <div class="farmer-card" data-id="${f.id || ''}">
                        <div class="card-header">
                            <img class="avatar" src="${avatar}" alt="${f.author_name || f.farm_name}" />
                            <div>
                                <div class="farm-name">
                                    ${f.farm_name || 'Unnamed Farm'}
                                    ${expertBadge}
                                    <small>${f.author_name || 'Farmer'}</small>
                                </div>
                            </div>
                        </div>

                        <div class="detail-row">
                            <i class="fas fa-seedling"></i>
                            <span>${cropTags || '—'}</span>
                        </div>

                        <div class="detail-row">
                            <i class="fas fa-map-pin"></i>
                            <span>${f.farm_location || 'Location not listed'}</span>
                        </div>

                        <div class="detail-row">
                            <i class="fas fa-calendar-alt"></i>
                            <span>${exp} years experience</span>
                        </div>

                        <div class="card-footer">
                            <span class="exp-text"><i class="far fa-clock"></i> Active farmer</span>
                            <button class="contact-btn" 
                                    data-name="${f.author_name || f.farm_name}" 
                                    data-email="${email}" 
                                    data-contact="${contactNumber}"
                                    data-experience="${exp}"
                                    data-location="${f.farm_location || ''}"
                                    data-pic="${avatar}">
                                <i class="fas fa-phone-alt"></i> Contact
                            </button>
                        </div>
                    </div>
                `;
            });

            grid.innerHTML = html;

            // --- Attach click listeners for "Contact" buttons ---
            document.querySelectorAll('.contact-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();

                    // Check if user is logged in (optional)
                    const userData = localStorage.getItem('agriUser');
                    if (!userData) {
                        alert('Please login to view farmer contact details.');
                        return;
                    }

                    // Gather data attributes
                    const profile = {
                        name: this.dataset.name || 'Farmer',
                        email: this.dataset.email || 'Not Listed',
                        contact: this.dataset.contact || '',
                        experience: this.dataset.experience || '',
                        location: this.dataset.location || '',
                        pic: this.dataset.pic || '',
                        isExpert: (parseInt(this.dataset.experience) || 0) >= 7
                    };

                    // Redirect to profile viewer (like your original agri.js logic)
                    const params = new URLSearchParams(profile);
                    window.location.href = `profile-viewer.html?${params.toString()}`;
                });
            });
        }

        // --- Event listeners ---
        searchInput.addEventListener('input', applyFilters);
        cropFilter.addEventListener('change', applyFilters);
        locationFilter.addEventListener('change', applyFilters);

        clearBtn.addEventListener('click', function() {
            searchInput.value = '';
            cropFilter.value = '';
            locationFilter.value = '';
            applyFilters();
        });

        // --- Start ---
        fetchFarmers();

    })();
</script>

</body>
</html>
