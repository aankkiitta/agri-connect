<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌾 Farmer Directory</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f9f2;
            color: #1a2a1a;
            padding: 1.2rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1440px;
            margin: 0 auto;
        }

        /* ===== HEADER ===== */
        .page-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            gap: 0.5rem;
        }

        .page-header h1 {
            font-size: 1.2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            color: #1a3a1a;
        }

        .page-header h1 i {
            color: #2d7a2d;
            font-size: 1.1rem;
        }

        .header-stats {
            background: white;
            padding: 0.2rem 0.9rem;
            border-radius: 16px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #2a4a2a;
            border: 1px solid #e0ece0;
        }

        .header-stats span {
            color: #0f3b0f;
            font-weight: 800;
        }

        /* ===== SEARCH BAR ===== */
        .search-bar {
            background: white;
            padding: 0.4rem 0.8rem;
            border-radius: 10px;
            border: 1px solid #e0ece0;
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            align-items: center;
            margin-bottom: 1rem;
        }

        .search-bar .search-box {
            flex: 2 1 150px;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            background: #f2f8ef;
            border-radius: 20px;
            padding: 0 0.7rem;
            border: 1px solid #dce8d6;
        }

        .search-bar .search-box:focus-within {
            border-color: #3a8a3a;
            box-shadow: 0 0 0 2px rgba(58, 138, 58, 0.08);
        }

        .search-bar .search-box i {
            color: #4a7a4a;
            font-size: 0.7rem;
        }

        .search-bar .search-box input {
            border: none;
            background: transparent;
            padding: 0.3rem 0;
            font-size: 0.75rem;
            width: 100%;
            outline: none;
            color: #1a2a1a;
        }

        .search-bar .search-box input::placeholder {
            color: #7a9a7a;
            font-weight: 400;
        }

        .search-bar .filter-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.3rem;
            flex: 1 1 140px;
        }

        .search-bar .filter-group select {
            background: #f2f8ef;
            border: 1px solid #dce8d6;
            border-radius: 20px;
            padding: 0.25rem 0.6rem;
            font-size: 0.7rem;
            font-weight: 500;
            color: #1f3a1f;
            cursor: pointer;
            outline: none;
            flex: 1 1 70px;
        }

        .search-bar .filter-group select:focus {
            border-color: #3a8a3a;
        }

        .search-bar .clear-btn {
            background: transparent;
            border: none;
            color: #5a7a5a;
            font-weight: 500;
            font-size: 0.65rem;
            cursor: pointer;
            padding: 0.2rem 0.5rem;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 0.2rem;
            white-space: nowrap;
        }

        .search-bar .clear-btn:hover {
            background: #eaf3e5;
            color: #1a401a;
        }

        /* ===== GRID: EXACTLY 4 CARDS PER ROW ===== */
        .farmers-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.7rem;
        }

        /* ===== MICRO CARD ===== */
        .farmer-card {
            background: white;
            border-radius: 10px;
            padding: 0.6rem 0.6rem 0.7rem;
            border: 1px solid #e4efe0;
            transition: transform 0.1s, box-shadow 0.12s;
            display: flex;
            flex-direction: column;
        }

        .farmer-card:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(30, 70, 30, 0.05);
            border-color: #c8ddc4;
        }

        /* Top: avatar + name */
        .card-top {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin-bottom: 0.2rem;
        }

        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid #deecda;
            background: #eaf3e5;
            flex-shrink: 0;
        }

        .farm-name-wrap {
            flex: 1;
            min-width: 0;
        }

        .farm-name {
            font-size: 0.7rem;
            font-weight: 700;
            color: #173017;
            line-height: 1.1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .farmer-name {
            font-size: 0.6rem;
            color: #4d6f4d;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Expert badge - ultra small */
        .expert-badge {
            background: #f6e9b3;
            color: #7a6100;
            font-weight: 700;
            font-size: 0.45rem;
            padding: 0.04rem 0.35rem;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            gap: 0.1rem;
            white-space: nowrap;
            margin-left: 0.1rem;
            vertical-align: middle;
        }

        .expert-badge i {
            font-size: 0.3rem;
        }

        /* Crop tags */
        .crop-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.15rem;
            margin: 0.1rem 0 0.2rem 0;
        }

        .crop-tag {
            background: #eef6ea;
            color: #1f4a1f;
            font-size: 0.5rem;
            font-weight: 500;
            padding: 0.04rem 0.4rem;
            border-radius: 12px;
            white-space: nowrap;
        }

        .crop-tag.more {
            background: #dce8d6;
            color: #2a4a2a;
        }

        /* Location */
        .detail-row {
            display: flex;
            align-items: center;
            gap: 0.2rem;
            font-size: 0.6rem;
            color: #3a553a;
            padding: 0.05rem 0;
        }

        .detail-row i {
            width: 0.6rem;
            color: #4a7a4a;
            font-size: 0.5rem;
            text-align: center;
        }

        .detail-row span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Footer */
        .card-footer {
            margin-top: 0.3rem;
            padding-top: 0.3rem;
            border-top: 1px solid #ecf4e8;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.2rem;
        }

        .exp-text {
            font-size: 0.55rem;
            color: #4a6a4a;
            background: #f0f7ec;
            padding: 0.04rem 0.5rem;
            border-radius: 12px;
            white-space: nowrap;
        }

        .contact-btn {
            background: #1f5a1f;
            color: white;
            border: none;
            padding: 0.15rem 0.5rem;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.55rem;
            cursor: pointer;
            transition: 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 0.15rem;
            white-space: nowrap;
        }

        .contact-btn:hover {
            background: #134013;
            box-shadow: 0 2px 6px rgba(26, 80, 26, 0.12);
        }

        .contact-btn i {
            font-size: 0.45rem;
        }

        /* ===== NO RESULTS ===== */
        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 2rem 1rem;
            background: white;
            border-radius: 12px;
            color: #3d5e3d;
            font-size: 0.8rem;
            border: 1px dashed #c2d8c2;
        }

        .no-results i {
            font-size: 1.4rem;
            color: #7ba07b;
            display: block;
            margin-bottom: 0.3rem;
        }

        /* ===== LOADING ===== */
        .loading-spinner {
            grid-column: 1 / -1;
            text-align: center;
            padding: 1.5rem;
            color: #3d683d;
            font-size: 0.8rem;
        }

        .loading-spinner i {
            font-size: 1.3rem;
            margin-bottom: 0.3rem;
            display: block;
            color: #3a7a3a;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1100px) {
            .farmers-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            .farmers-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            body {
                padding: 0.8rem;
            }
        }

        @media (max-width: 480px) {
            .farmers-grid {
                grid-template-columns: 1fr;
            }
            .search-bar {
                flex-direction: column;
                align-items: stretch;
                padding: 0.6rem;
            }
            .search-bar .filter-group select {
                flex: 1 1 100%;
            }
            .page-header h1 {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- HEADER -->
    <div class="page-header">
        <h1><i class="fas fa-seedling"></i> Farmer Directory</h1>
        <div class="header-stats">
            <i class="fas fa-users" style="margin-right: 2px;"></i>
            <span id="farmerCount">0</span> farmers
        </div>
    </div>

    <!-- SEARCH & FILTER -->
    <div class="search-bar">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search name, crop, location..." />
        </div>
        <div class="filter-group">
            <select id="cropFilter">
                <option value="">All Crops</option>
            </select>
            <select id="locationFilter">
                <option value="">All Locations</option>
            </select>
            <button class="clear-btn" id="clearFiltersBtn"><i class="fas fa-undo-alt"></i> Reset</button>
        </div>
    </div>

    <!-- GRID: 4 cards per row -->
    <div class="farmers-grid" id="farmersGrid">
        <div class="loading-spinner">
            <i class="fas fa-circle-notch fa-spin"></i>
            Loading farmers...
        </div>
    </div>

</div>

<script>
    (function() {
        'use strict';

        const grid = document.getElementById('farmersGrid');
        const searchInput = document.getElementById('searchInput');
        const cropFilter = document.getElementById('cropFilter');
        const locationFilter = document.getElementById('locationFilter');
        const clearBtn = document.getElementById('clearFiltersBtn');
        const farmerCountSpan = document.getElementById('farmerCount');

        let allFarmers = [];

        async function fetchFarmers() {
            try {
                const response = await fetch('/api/approved-farmers', {
                    method: 'GET',
                    headers: { 'Cache-Control': 'no-cache' }
                });

                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                const data = await response.json();
                allFarmers = Array.isArray(data) ? data : [];

                populateFilters(allFarmers);
                applyFilters();

            } catch (err) {
                console.error('Failed to fetch farmers:', err);
                grid.innerHTML = `
                    <div class="no-results">
                        <i class="fas fa-exclamation-triangle"></i>
                        Unable to load farmers.
                    </div>
                `;
                farmerCountSpan.textContent = '0';
            }
        }

        function populateFilters(farmers) {
            const cropsSet = new Set();
            const locsSet = new Set();

            farmers.forEach(f => {
                if (f.crop_specialization) {
                    const crops = f.crop_specialization.split(',').map(c => c.trim()).filter(Boolean);
                    crops.forEach(c => cropsSet.add(c));
                }
                if (f.farm_location) locsSet.add(f.farm_location.trim());
            });

            cropFilter.innerHTML = '<option value="">All Crops</option>';
            [...cropsSet].sort().forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = c;
                cropFilter.appendChild(opt);
            });

            locationFilter.innerHTML = '<option value="">All Locations</option>';
            [...locsSet].sort().forEach(l => {
                const opt = document.createElement('option');
                opt.value = l;
                opt.textContent = l;
                locationFilter.appendChild(opt);
            });
        }

        function applyFilters() {
            const term = searchInput.value.trim().toLowerCase();
            const cropVal = cropFilter.value.toLowerCase();
            const locVal = locationFilter.value.toLowerCase();

            const filtered = allFarmers.filter(f => {
                const nameMatch = (f.author_name || '').toLowerCase().includes(term);
                const farmMatch = (f.farm_name || '').toLowerCase().includes(term);
                const cropMatch = (f.crop_specialization || '').toLowerCase().includes(term);
                const locMatch = (f.farm_location || '').toLowerCase().includes(term);
                const searchPass = term === '' || nameMatch || farmMatch || cropMatch || locMatch;

                let cropPass = true;
                if (cropVal !== '') {
                    const fcrops = (f.crop_specialization || '').split(',').map(c => c.trim().toLowerCase());
                    cropPass = fcrops.includes(cropVal);
                }

                const locationPass = locVal === '' || (f.farm_location || '').toLowerCase() === locVal;

                return searchPass && cropPass && locationPass;
            });

            renderFarmers(filtered);
            farmerCountSpan.textContent = filtered.length;
        }

        function renderFarmers(farmers) {
            if (!farmers.length) {
                grid.innerHTML = `
                    <div class="no-results">
                        <i class="fas fa-tractor"></i>
                        No farmers match your filters.
                    </div>
                `;
                return;
            }

            let html = '';
            farmers.forEach(f => {
                const avatar = f.profile_picture_url && f.profile_picture_url.startsWith('http')
                    ? f.profile_picture_url
                    : 'https://ui-avatars.com/api/?name=' + encodeURIComponent(f.author_name || f.farm_name || 'F') + '&background=dce8d4&color=1f4a1f&size=30&font-size=0.35';

                let cropTags = '';
                if (f.crop_specialization) {
                    const crops = f.crop_specialization.split(',').map(c => c.trim()).filter(Boolean);
                    cropTags = crops.slice(0, 2).map(c =>
                        `<span class="crop-tag">${c}</span>`
                    ).join(' ');
                    if (crops.length > 2) cropTags += `<span class="crop-tag more">+${crops.length - 2}</span>`;
                }

                const exp = parseInt(f.years_experience) || 0;
                const expertBadge = exp >= 7
                    ? `<span class="expert-badge"><i class="fas fa-star"></i>Expert</span>`
                    : '';

                const contactNumber = f.contact_number || '';
                const email = f.email || f.contact_email || '';

                html += `
                    <div class="farmer-card">
                        <div class="card-top">
                            <img class="avatar" src="${avatar}" alt="${f.author_name || f.farm_name}" />
                            <div class="farm-name-wrap">
                                <div class="farm-name">
                                    ${f.farm_name || 'Farm'}
                                    ${expertBadge}
                                </div>
                                <div class="farmer-name">${f.author_name || 'Farmer'}</div>
                            </div>
                        </div>

                        <div class="crop-tags">${cropTags || '<span style="font-size:0.5rem; color:#7a9a7a;">—</span>'}</div>

                        <div class="detail-row">
                            <i class="fas fa-map-pin"></i>
                            <span>${f.farm_location || 'Location not listed'}</span>
                        </div>

                        <div class="card-footer">
                            <span class="exp-text"><i class="far fa-clock"></i> ${exp}y</span>
                            <button class="contact-btn"
                                    data-name="${f.author_name || f.farm_name}"
                                    data-email="${email}"
                                    data-contact="${contactNumber}"
                                    data-experience="${exp}"
                                    data-location="${f.farm_location || ''}"
                                    data-pic="${avatar}">
                                <i class="fas fa-phone-alt"></i> Contact
                            </button>
                        </div>
                    </div>
                `;
            });

            grid.innerHTML = html;

            document.querySelectorAll('.contact-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();

                    const userData = localStorage.getItem('agriUser');
                    if (!userData) {
                        alert('Please login to view farmer contact details.');
                        return;
                    }

                    const profile = {
                        name: this.dataset.name || 'Farmer',
                        email: this.dataset.email || 'Not Listed',
                        contact: this.dataset.contact || '',
                        experience: this.dataset.experience || '',
                        location: this.dataset.location || '',
                        pic: this.dataset.pic || '',
                        isExpert: (parseInt(this.dataset.experience) || 0) >= 7
                    };

                    const params = new URLSearchParams(profile);
                    window.location.href = `profile-viewer.html?${params.toString()}`;
                });
            });
        }

        searchInput.addEventListener('input', applyFilters);
        cropFilter.addEventListener('change', applyFilters);
        locationFilter.addEventListener('change', applyFilters);

        clearBtn.addEventListener('click', function() {
            searchInput.value = '';
            cropFilter.value = '';
            locationFilter.value = '';
            applyFilters();
        });

        fetchFarmers();

    })();
</script>

</body>
</html>
