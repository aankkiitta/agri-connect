<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌾 Farmer Directory - AgriConnect</title>
    <!-- Font Awesome 6 (Free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #16a34a;
            --primary-dark: #15803d;
            --primary-light: #dcfce7;
            --secondary: #facc15;
            --secondary-dark: #eab308;
            --bg-body: #f0fdf4;
            --bg-light: #f9fafb;
            --bg-white: #ffffff;
            --bg-card: #ffffff;
            --text-main: #2d3748;
            --text-dark: #1f2937;
            --text-muted: #4b5563;
            --border: #e5e7eb;
            --shadow-color: rgba(0, 0, 0, 0.1);
            --font-stack: 'Inter', sans-serif;
            --shadow-md: 0 4px 6px -1px var(--shadow-color);
            --shadow-lg: 0 10px 25px -3px var(--shadow-color);
        }

        [data-theme="dark"] {
            --primary: #22c55e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-stack);
            background: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
        }

        /* ===== HEADER - DARK GREEN ===== */
        .top-header {
            background: #065f46;
            padding: 0 2rem;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .header-left .home-link {
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            transition: 0.2s;
        }

        .header-left .home-link:hover {
            background: rgba(255,255,255,0.1);
            color: white;
        }

        .header-left .home-link i {
            font-size: 0.9rem;
        }

        .header-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            letter-spacing: 0.3px;
        }

        .logo i {
            font-size: 1.3rem;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .header-right .user-info {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .header-right .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 0.8rem;
            border: 2px solid rgba(255,255,255,0.2);
        }

        .header-right .user-name {
            font-size: 0.85rem;
            font-weight: 500;
            color: rgba(255,255,255,0.9);
        }

        .header-right .settings-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.7);
            font-size: 1rem;
            cursor: pointer;
            padding: 0.3rem 0.5rem;
            border-radius: 6px;
            transition: 0.2s;
        }

        .header-right .settings-btn:hover {
            background: rgba(255,255,255,0.1);
            color: white;
        }

        .mobile-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 1.2rem;
            color: white;
            cursor: pointer;
            padding: 0.3rem;
        }

        /* ===== MAIN CONTENT ===== */
        .page-wrapper {
            max-width: 1280px;
            margin: 0 auto;
            padding: 1.5rem 2rem 2.5rem;
        }

        /* ===== PAGE HEADER ===== */
        .page-header {
            margin-bottom: 1.5rem;
        }

        .page-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .page-header h1 i {
            color: var(--primary);
        }

        /* ===== STATISTICS CARDS ===== */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: var(--bg-white);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .stat-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-dark);
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .stat-content {
            flex: 1;
        }

        .stat-content .stat-label {
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-content .stat-number {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-dark);
            line-height: 1.2;
        }

        /* ===== SEARCH SECTION - COMPACT ===== */
        .search-section {
            background: var(--bg-white);
            padding: 0.75rem 1.25rem;
            border-radius: 12px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg-body);
            border-radius: 30px;
            padding: 0 1.2rem;
            border: 1px solid var(--border);
            transition: 0.2s;
            height: 48px;
            width: 100%;
        }

        .search-box:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.12);
        }

        .search-box i {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-right: 0.75rem;
            flex-shrink: 0;
        }

        .search-box input {
            border: none;
            background: transparent;
            padding: 0.5rem 0;
            font-size: 0.9rem;
            width: 100%;
            outline: none;
            color: var(--text-dark);
            font-family: var(--font-stack);
            height: 100%;
        }

        .search-box input::placeholder {
            color: #9ca3af;
            font-weight: 400;
        }

        /* ===== FARMER GRID ===== */
        .farmers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.25rem;
        }

        /* ===== FARMER CARD - COMPACT ===== */
        .farmer-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 1rem 1.25rem 1.1rem;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
        }

        .farmer-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            border-color: var(--primary-light);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-light);
            background: var(--bg-body);
            flex-shrink: 0;
        }

        .farmer-info {
            flex: 1;
            min-width: 0;
        }

        .farmer-name {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-dark);
            line-height: 1.2;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            flex-wrap: wrap;
        }

        .farmer-name small {
            font-weight: 400;
            font-size: 0.75rem;
            color: var(--text-muted);
            display: block;
            margin-top: 1px;
        }

        .expert-badge {
            background: var(--secondary);
            color: #7a6100;
            font-weight: 600;
            font-size: 0.55rem;
            padding: 0.05rem 0.5rem;
            border-radius: 30px;
            display: inline-flex;
            align-items: center;
            gap: 0.15rem;
            letter-spacing: 0.2px;
            vertical-align: middle;
        }

        .expert-badge i {
            font-size: 0.45rem;
        }

        .farmer-details {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            margin-top: 0.25rem;
        }

        .detail-row {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .detail-row i {
            width: 0.9rem;
            color: var(--primary);
            font-size: 0.75rem;
            flex-shrink: 0;
            text-align: center;
        }

        .crop-tag {
            display: inline-block;
            background: var(--primary-light);
            color: var(--primary-dark);
            font-size: 0.65rem;
            font-weight: 500;
            padding: 0.1rem 0.6rem;
            border-radius: 30px;
            margin: 0.1rem 0.15rem 0.1rem 0;
        }

        .card-footer {
            margin-top: 0.75rem;
            padding-top: 0.6rem;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 0.5rem;
        }

        .contact-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.35rem 1.1rem;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-family: var(--font-stack);
        }

        .contact-btn:hover {
            background: var(--primary-dark);
            transform: scale(1.02);
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.25);
        }

        .exp-text {
            font-size: 0.7rem;
            color: var(--text-muted);
            background: var(--bg-light);
            padding: 0.15rem 0.7rem;
            border-radius: 30px;
            margin-right: auto;
        }

        /* ===== NO RESULTS ===== */
        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem 1rem;
            background: var(--bg-white);
            border-radius: 16px;
            color: var(--text-muted);
            font-size: 1rem;
            border: 1px dashed var(--border);
        }

        .no-results i {
            font-size: 2rem;
            color: var(--primary);
            display: block;
            margin-bottom: 0.6rem;
        }

        /* ===== LOADING ===== */
        .loading-spinner {
            grid-column: 1 / -1;
            text-align: center;
            padding: 2.5rem;
            color: var(--text-muted);
            font-size: 1rem;
        }

        .loading-spinner i {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            display: block;
            color: var(--primary);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 992px) {
            .top-header {
                padding: 0 1.5rem;
            }
        }

        @media (max-width: 768px) {
            .top-header {
                padding: 0 1rem;
                height: 56px;
            }

            .header-center {
                position: static;
                transform: none;
            }

            .logo {
                font-size: 1rem;
            }

            .header-right .user-name {
                display: none;
            }

            .page-wrapper {
                padding: 1rem 1rem 1.5rem;
            }

            .page-header h1 {
                font-size: 1.4rem;
            }

            .stats-row {
                grid-template-columns: 1fr 1fr;
                gap: 0.75rem;
            }

            .stat-card {
                padding: 0.8rem 1rem;
            }

            .stat-content .stat-number {
                font-size: 1.2rem;
            }

            .search-section {
                padding: 0.5rem 0.75rem;
            }

            .search-box {
                height: 44px;
                padding: 0 1rem;
                border-radius: 24px;
            }

            .search-box input {
                font-size: 0.85rem;
            }

            .farmers-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 1rem;
            }

            .farmer-card {
                padding: 0.9rem 1rem 1rem;
            }
        }

        @media (max-width: 480px) {
            .top-header {
                padding: 0 0.75rem;
                height: 52px;
            }

            .header-left .home-link span {
                display: none;
            }

            .header-left .home-link i {
                font-size: 1.1rem;
            }

            .logo {
                font-size: 0.9rem;
            }

            .logo i {
                font-size: 1rem;
            }

            .page-wrapper {
                padding: 0.75rem 0.75rem 1.5rem;
            }

            .page-header h1 {
                font-size: 1.2rem;
            }

            .stats-row {
                grid-template-columns: 1fr;
                gap: 0.5rem;
            }

            .stat-card {
                padding: 0.6rem 0.8rem;
            }

            .stat-icon {
                width: 36px;
                height: 36px;
                font-size: 1rem;
            }

            .stat-content .stat-number {
                font-size: 1.1rem;
            }

            .stat-content .stat-label {
                font-size: 0.65rem;
            }

            .search-section {
                padding: 0.4rem 0.6rem;
                border-radius: 10px;
            }

            .search-box {
                height: 40px;
                padding: 0 0.8rem;
                border-radius: 22px;
            }

            .search-box input {
                font-size: 0.8rem;
            }

            .search-box i {
                font-size: 0.8rem;
                margin-right: 0.5rem;
            }

            .farmers-grid {
                grid-template-columns: 1fr;
                gap: 0.75rem;
            }

            .farmer-card {
                padding: 0.7rem 0.8rem 0.85rem;
                border-radius: 12px;
            }

            .avatar {
                width: 38px;
                height: 38px;
            }

            .farmer-name {
                font-size: 0.85rem;
            }

            .farmer-name small {
                font-size: 0.7rem;
            }

            .detail-row {
                font-size: 0.75rem;
            }

            .crop-tag {
                font-size: 0.6rem;
                padding: 0.08rem 0.5rem;
            }

            .contact-btn {
                font-size: 0.7rem;
                padding: 0.25rem 0.9rem;
            }

            .exp-text {
                font-size: 0.65rem;
                padding: 0.1rem 0.6rem;
            }
        }

        @media (max-width: 360px) {
            .logo {
                font-size: 0.8rem;
            }

            .page-header h1 {
                font-size: 1rem;
            }

            .stat-content .stat-number {
                font-size: 0.95rem;
            }

            .search-box {
                height: 36px;
                padding: 0 0.6rem;
                border-radius: 20px;
            }

            .search-box input {
                font-size: 0.75rem;
            }

            .farmer-card {
                padding: 0.6rem;
            }

            .avatar {
                width: 34px;
                height: 34px;
            }

            .farmer-name {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER - DARK GREEN ===== -->
    <header class="top-header">
        <div class="header-left">
            <a href="/" class="home-link">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
        </div>
        <div class="header-center">
            <a href="/" class="logo">
                <i class="fas fa-leaf"></i>
                AgriConnect
            </a>
        </div>
        <div class="header-right">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">U</div>
                <span class="user-name" id="userName">User</span>
            </div>
            <button class="settings-btn" aria-label="Settings">
                <i class="fas fa-cog"></i>
            </button>
        </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="page-wrapper">

        <!-- PAGE HEADER -->
        <div class="page-header">
            <h1><i class="fas fa-seedling"></i> Farmer Directory</h1>
        </div>

        <!-- STATISTICS CARDS -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-users"></i>
                </div>
                <div class="stat-content">
                    <div class="stat-label">Total Users</div>
                    <div class="stat-number" id="totalUsers">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fas fa-user-tie"></i>
                </div>
                <div class="stat-content">
                    <div class="stat-label">Registered Farmers</div>
                    <div class="stat-number" id="registeredFarmers">0</div>
                </div>
            </div>
        </div>

        <!-- SEARCH SECTION - COMPACT -->
        <div class="search-section">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search by name, crop, or location..." />
            </div>
        </div>

        <!-- GRID -->
        <div class="farmers-grid" id="farmersGrid">
            <div class="loading-spinner">
                <i class="fas fa-circle-notch fa-spin"></i>
                Loading farmers...
            </div>
        </div>

    </div>

    <script>
        (function() {
            'use strict';

            // ===== USER INFO =====
            function loadUserInfo() {
                try {
                    const userData = localStorage.getItem('agriUser');
                    if (userData) {
                        const user = JSON.parse(userData);
                        const name = user.name || user.username || 'User';
                        const initial = name.charAt(0).toUpperCase();
                        document.getElementById('userName').textContent = name;
                        document.getElementById('userAvatar').textContent = initial;
                    }
                } catch (_) {}
            }
            loadUserInfo();

            // ===== FARMER DIRECTORY LOGIC =====
            const grid = document.getElementById('farmersGrid');
            const searchInput = document.getElementById('searchInput');
            const totalUsersEl = document.getElementById('totalUsers');
            const registeredFarmersEl = document.getElementById('registeredFarmers');

            let allFarmers = [];
            let filteredFarmers = [];

            // ===== FETCH STATISTICS =====
            async function fetchStatistics() {
                try {
                    const usersRes = await fetch('/api/users/count', {
                        method: 'GET',
                        headers: { 'Cache-Control': 'no-cache' }
                    });
                    if (usersRes.ok) {
                        const usersData = await usersRes.json();
                        totalUsersEl.textContent = usersData.count || 0;
                    }

                    const farmersRes = await fetch('/api/approved-farmers', {
                        method: 'GET',
                        headers: { 'Cache-Control': 'no-cache' }
                    });
                    if (farmersRes.ok) {
                        const farmersData = await farmersRes.json();
                        const count = Array.isArray(farmersData) ? farmersData.length : 0;
                        registeredFarmersEl.textContent = count;
                    }
                } catch (err) {
                    console.warn('Could not fetch statistics:', err);
                    totalUsersEl.textContent = '—';
                    registeredFarmersEl.textContent = '—';
                }
            }

            // ===== FETCH FARMERS =====
            async function fetchFarmers() {
                try {
                    const response = await fetch('/api/approved-farmers', {
                        method: 'GET',
                        headers: { 'Cache-Control': 'no-cache' }
                    });

                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                    const data = await response.json();
                    allFarmers = Array.isArray(data) ? data : [];

                    registeredFarmersEl.textContent = allFarmers.length;
                    applyFilters();

                } catch (err) {
                    console.error('Failed to fetch farmers:', err);
                    grid.innerHTML = `
                        <div class="no-results">
                            <i class="fas fa-exclamation-triangle"></i>
                            Unable to load farmers.<br />
                            <span style="font-size:0.85rem; color:var(--text-muted);">Please check your server connection.</span>
                        </div>
                    `;
                    registeredFarmersEl.textContent = '0';
                }
            }

            function applyFilters() {
                const searchTerm = searchInput.value.trim().toLowerCase();

                filteredFarmers = allFarmers.filter(farmer => {
                    const nameMatch = (farmer.author_name || '').toLowerCase().includes(searchTerm);
                    const farmMatch = (farmer.farm_name || '').toLowerCase().includes(searchTerm);
                    const cropMatch = (farmer.crop_specialization || '').toLowerCase().includes(searchTerm);
                    const locMatch = (farmer.farm_location || '').toLowerCase().includes(searchTerm);
                    return searchTerm === '' || nameMatch || farmMatch || cropMatch || locMatch;
                });

                renderFarmers(filteredFarmers);
            }

            function renderFarmers(farmers) {
                if (!farmers.length) {
                    grid.innerHTML = `
                        <div class="no-results">
                            <i class="fas fa-tractor"></i>
                            No farmers match your search.<br />
                            <span style="font-size:0.85rem; color:var(--text-muted);">Try adjusting your search terms.</span>
                        </div>
                    `;
                    return;
                }

                let html = '';
                farmers.forEach(f => {
                    const avatar = f.profile_picture_url && f.profile_picture_url.startsWith('http')
                        ? f.profile_picture_url
                        : 'https://ui-avatars.com/api/?name=' + encodeURIComponent(f.author_name || f.farm_name || 'Farmer') + '&background=dcfce7&color=15803d&size=44';

                    let cropTags = '';
                    if (f.crop_specialization) {
                        const crops = f.crop_specialization.split(',').map(c => c.trim()).filter(Boolean);
                        cropTags = crops.map(c => `<span class="crop-tag">${c}</span>`).join(' ');
                    }

                    const exp = parseInt(f.years_experience) || 0;
                    const expertBadge = exp >= 7 ? `<span class="expert-badge"><i class="fas fa-star"></i> Expert</span>` : '';

                    const contactNumber = f.contact_number || '';
                    const email = f.email || f.contact_email || '';

                    html += `
                        <div class="farmer-card" data-id="${f.id || ''}">
                            <div class="card-header">
                                <img class="avatar" src="${avatar}" alt="${f.author_name || f.farm_name}" />
                                <div class="farmer-info">
                                    <div class="farmer-name">
                                        ${f.author_name || 'Farmer'}
                                        ${expertBadge}
                                        <small>${f.farm_name || 'Unnamed Farm'}</small>
                                    </div>
                                </div>
                            </div>

                            <div class="farmer-details">
                                <div class="detail-row">
                                    <i class="fas fa-seedling"></i>
                                    <span>${cropTags || '—'}</span>
                                </div>
                                <div class="detail-row">
                                    <i class="fas fa-map-pin"></i>
                                    <span>${f.farm_location || 'Location not listed'}</span>
                                </div>
                                <div class="detail-row">
                                    <i class="fas fa-calendar-alt"></i>
                                    <span>${exp} years experience</span>
                                </div>
                            </div>

                            <div class="card-footer">
                                <span class="exp-text"><i class="far fa-clock"></i> Active</span>
                                <button class="contact-btn" 
                                        data-name="${f.author_name || f.farm_name}" 
                                        data-email="${email}" 
                                        data-contact="${contactNumber}"
                                        data-experience="${exp}"
                                        data-location="${f.farm_location || ''}"
                                        data-pic="${avatar}">
                                    <i class="fas fa-phone-alt"></i> Contact
                                </button>
                            </div>
                        </div>
                    `;
                });

                grid.innerHTML = html;

                document.querySelectorAll('.contact-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();

                        const userData = localStorage.getItem('agriUser');
                        if (!userData) {
                            alert('Please login to view farmer contact details.');
                            return;
                        }

                        const profile = {
                            name: this.dataset.name || 'Farmer',
                            email: this.dataset.email || 'Not Listed',
                            contact: this.dataset.contact || '',
                            experience: this.dataset.experience || '',
                            location: this.dataset.location || '',
                            pic: this.dataset.pic || '',
                            isExpert: (parseInt(this.dataset.experience) || 0) >= 7
                        };

                        const params = new URLSearchParams(profile);
                        window.location.href = `profile-viewer.html?${params.toString()}`;
                    });
                });
            }

            // ===== EVENT LISTENERS =====
            searchInput.addEventListener('input', applyFilters);

            // ===== START =====
            fetchStatistics();
            fetchFarmers();

        })();
    </script>

</body>
</html>
