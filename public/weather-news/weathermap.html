// --- Global marker for clicked location ---
let clickedMarker = null;

// --- ✨ NEW: Helper function to format time ---
function formatTime(timestamp) {
  // Multiply by 1000 because JS Date uses milliseconds
  const date = new Date(timestamp * 1000);
  return date.toLocaleTimeString('en-IN', {
    hour: '2-digit',
    minute: '2-digit',
    hour12: true
  });
}

// === Main Functionality ===

// 1. This function runs on page load
function initializeMap() {

  // 🔥 1. LOAD ALL CITY MARKERS
  locations.forEach(loc => {
    L.marker([loc.lat, loc.lon], { icon: cityIcon })
      .addTo(map)
      .bindPopup(loc.city)
      .on('click', () => {
        getWeatherByCity(loc.city, loc.city);
        map.flyTo([loc.lat, loc.lon], 10);

        // ✅ SAVE LOCATION
        localStorage.setItem("lat", loc.lat);
        localStorage.setItem("lon", loc.lon);
      });
  });

  // 🔥 2. CHECK SAVED LOCATION
  const saved = getSavedLocation();

  if (saved) {
    map.setView([saved.lat, saved.lon], 10);

    if (clickedMarker) {
      map.removeLayer(clickedMarker);
    }

    clickedMarker = L.marker([saved.lat, saved.lon], { icon: geoIcon })
      .addTo(map)
      .bindPopup("Selected Location")
      .openPopup();

    getWeatherByCoords(saved.lat, saved.lon);

  } else {
    // ✅ FALLBACK GPS
    if ('geolocation' in navigator) {
      navigator.geolocation.getCurrentPosition(handleGeoSuccess, handleGeoError);
    } else {
      handleGeoError();
    }
  }

  // 🔥 3. SEARCH FUNCTION (IMPORTANT)
  searchBtn.addEventListener('click', handleSearch);
  citySearchInput.addEventListener('keyup', (e) => {
    if (e.key === 'Enter') {
      handleSearch();
    }
  });

  // 🔥 4. CLICK ON MAP (VERY IMPORTANT)
  map.on('click', function (e) {
    const lat = e.latlng.lat;
    const lon = e.latlng.lng;

    if (clickedMarker) {
      map.removeLayer(clickedMarker);
    }

    clickedMarker = L.marker([lat, lon], { icon: geoIcon })
      .addTo(map)
      .bindPopup("Selected Location")
      .openPopup();

    // ✅ SAVE LOCATION
    localStorage.setItem("lat", lat);
    localStorage.setItem("lon", lon);

    getWeatherByCoords(lat, lon);
  });


  // 🔥 3. SEARCH FUNCTIONALITY (IMPORTANT)
  searchBtn.addEventListener('click', handleSearch);
  citySearchInput.addEventListener('keyup', (e) => {
    if (e.key === 'Enter') {
      handleSearch();
    }
  });

  // 🔥 4. MAP CLICK EVENT (VERY IMPORTANT)
  map.on('click', function (e) {
    const lat = e.latlng.lat;
    const lon = e.latlng.lng;

    if (clickedMarker) {
      map.removeLayer(clickedMarker);
    }

    clickedMarker = L.marker([lat, lon], { icon: geoIcon })
      .addTo(map)
      .bindPopup("Selected Location")
      .openPopup();

    // ✅ SAVE LOCATION
    localStorage.setItem("lat", lat);
    localStorage.setItem("lon", lon);

    getWeatherByCoords(lat, lon);
  });
}

// 2. Called if user ALLOWS location
function handleGeoSuccess(position) {
  const lat = position.coords.latitude;
  const lon = position.coords.longitude;
  map.setView([lat, lon], 10);
  
  // Remove previous temp marker if it exists
  if (clickedMarker) {
    map.removeLayer(clickedMarker);
  }
  
  L.marker([lat, lon], { icon: geoIcon })
    .addTo(map)
    .bindPopup('Your Location')
    .openPopup();
  getWeatherByCoords(lat, lon);
}

// 3. Called if user BLOCKS location
function handleGeoError() {
  console.warn("Geolocation error. Defaulting to New Delhi.");
  const DELHI_LAT = 28.6139;
  const DELHI_LON = 77.2090;
  map.setView([DELHI_LAT, DELHI_LON], 6); 
  getWeatherByCity('New Delhi', 'New Delhi');
}

// 4. Fetches weather by coordinates (used for geolocation AND map click)
function getWeatherByCoords(lat, lon) {

  localStorage.setItem("lat", lat);
localStorage.setItem("lon", lon);
  const weatherUrl = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${apiKey}&units=metric`;
  const forecastUrl = `https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&appid=${apiKey}&units=metric`;
  fetchAndDisplayWeather(weatherUrl, forecastUrl, "Clicked Location");
}

// 5. Fetches weather by city name (used for markers AND SEARCH)
function getWeatherByCity(cityName, locationName) {
  const weatherUrl = `https://api.openweathermap.org/data/2.5/weather?q=${cityName}&appid=${apiKey}&units=metric`;
  const forecastUrl = `https://api.openweathermap.org/data/2.5/forecast?q=${cityName}&appid=${apiKey}&units=metric`;
  fetchAndDisplayWeather(weatherUrl, forecastUrl, locationName);
}

// Handle Search Function
function handleSearch() {
  const cityName = citySearchInput.value.trim();
  if (cityName) {
    getWeatherByCity(cityName, cityName);
    citySearchInput.value = ''; // Clear input
  }
}

// Handle Click on Map
function handleMapClick(e) {
  const { lat, lng } = e.latlng;
  
  // Remove the previous clicked marker if it exists
  if (clickedMarker) {
    map.removeLayer(clickedMarker);
  }
  
  // Add a new marker (blue, pulsing)
  clickedMarker = L.marker([lat, lng], { icon: geoIcon })
    .addTo(map)
    .bindPopup('Clicked Location')
    .openPopup();
    
  // Pan to the new marker
  map.flyTo([lat, lng], map.getZoom()); // Keep current zoom level
  
  // Fetch weather for these coords
  getWeatherByCoords(lat, lng);
}


// 6. Main function to fetch and build the card
function fetchAndDisplayWeather(weatherUrl, forecastUrl, locationName) {
  weatherCard.innerHTML = '<div class="loader">Loading weather...</div>';
  weatherCard.classList.remove('error');

  let weatherData = {};

  // First, get the current weather
  fetch(weatherUrl)
    .then(res => {
      if (!res.ok) throw new Error(`Weather data not found (${res.status})`);
      return res.json();
    })
    .then(data => {
      weatherData = data; // Save current weather data

      // --- BLUE PULSING MARKER LOGIC ---
      const { lat, lon } = data.coord;

      // 1. Fly map to location if it's a search (not a manual map click)
      if (locationName !== "Clicked Location") {
          map.flyTo([lat, lon], 10);
      }

      // 2. Remove previous marker to keep the map clean
      if (clickedMarker) {
          map.removeLayer(clickedMarker);
      }

      // 3. Add the blue pulsing marker at the search result coordinates
      clickedMarker = L.marker([lat, lon], { icon: geoIcon })
          .addTo(map)
          .bindPopup(`<b>${data.name}</b><br>Location Found`)
          .openPopup();
      // ---------------------------------

      const { temp, humidity } = data.main;
      const { sunrise, sunset } = data.sys; 
      const desc = data.weather[0].description;
      const icon = data.weather[0].icon;
      const iconUrl = `https://openweathermap.org/img/wn/${icon}@2x.png`;
      
      const displayName = (locationName === "Your Location" || locationName === "Clicked Location") ? data.name : locationName;

      // Farmer's Advice
      const rain = desc.includes("rain") || desc.includes("storm");
      const outdoor = (humidity > 85 || temp > 38 || temp < 10);
      const rainAdvice = rain ? "Needed" : "Not Needed";
      const outdoorAdvice = outdoor ? "Poor" : "Good";
      const rainClass = rain ? "bad" : "good";
      const outdoorClass = outdoor ? "good" : "bad";
      const now = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });

      // Render the floating weather card
      weatherCard.innerHTML = `
        <h2>${displayName}</h2>
        <small>As of ${now} GMT+5:30</small>
        <div style="display: flex; align-items: center; gap: 10px; margin-top: 10px;">
          <img src="${iconUrl}" width="50" alt="${desc}">
          <div class="temp">${Math.round(temp)}°C</div>
        </div>
        <div class="desc">${desc}</div>
        
        <div class="sun-times">
          <div>🌅 Sunrise: <span>${formatTime(sunrise)}</span></div>
          <div>🌇 Sunset: <span>${formatTime(sunset)}</span></div>
        </div>
        
        <div class="advice">
          <div class="${rainClass}">☔ Rain Gear<br>${rainAdvice}</div>
          <div class="${outdoorClass}">🧑‍🌾 Field Work<br>${outdoorAdvice}</div>
        </div>
        <div class="forecast">
          <strong>3-Day Forecast:</strong>
          <div id="forecastDays">
            <div class="loader">Loading forecast...</div>
          </div>
        </div>
      `;

      return fetch(forecastUrl);
    })
    .then(res => {
      if (!res.ok) throw new Error(`Forecast data not found (${res.status})`);
      return res.json();
    })
    .then(forecastData => {
      const forecastContainer = document.getElementById('forecastDays');
      forecastContainer.innerHTML = '';
      
      const filtered = forecastData.list.filter(item => item.dt_txt.includes("12:00:00")).slice(0, 3);

      if(filtered.length === 0) {
        forecastContainer.innerHTML = "Forecast data not available.";
        return;
      }

      filtered.forEach(item => {
        const date = new Date(item.dt_txt);
        const day = date.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });
        const temp = item.main.temp.toFixed(1);
        const icon = item.weather[0].icon;
        const desc = item.weather[0].description;
        const iconUrl = `https://openweathermap.org/img/wn/${icon}.png`;

        forecastContainer.innerHTML += `
          <div class="forecast-day">
            <div>${day}</div>
            <img src="${iconUrl}" alt="${desc}">
            <b>${temp}°C</b>
          </div>
        `;
      });
    })
    .catch(err => {
      console.error(err);
      weatherCard.classList.add('error');
      weatherCard.innerHTML = `
        <h2>Error</h2>
        <p>Could not find weather for that location.</p>
        <p><small>${err.message}</small></p>
      `;
    });
}

window.addEventListener('message', function(event) {
    if (event.data.type === 'UPDATE_LOCATION') {
        const { lat, lon, name } = event.data;
        
        // Move the map to the new spot
        map.flyTo([lat, lon], 10);
        
        // Update the weather info inside the map card
        getWeatherByCoords(lat, lon);
        
        // Update the blue pulsing marker
        if (clickedMarker) map.removeLayer(clickedMarker);
        clickedMarker = L.marker([lat, lon], { icon: geoIcon })
            .addTo(map)
            .bindPopup(`<b>${name}</b>`)
            .openPopup();
    }
});
