<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>India Weather Map - 3 Day Forecast</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
  <style>
    body {
      margin: 0;
      font-family: "Poppins", "Segoe UI", sans-serif;
      background: #121212;
      color: white;
      scroll-behavior: smooth;
    }
    #title {
      padding: 15px 30px; /* Adjusted padding */
      font-size: 1.5rem;
      font-weight: 600;
      background: #1e1e1e;
      /* Made title bar a flex container */
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap; /* Allow wrapping on small screens */
      gap: 15px;
    }
    
    /* Search Bar Styles */
    .search-container {
      display: flex;
    }
    #citySearch {
      font-family: "Poppins", "Segoe UI", sans-serif;
      font-size: 1rem;
      padding: 8px 12px;
      border: 1px solid #444;
      border-right: none;
      border-radius: 8px 0 0 8px;
      background: #333;
      color: #fff;
    }
    #citySearch:focus {
      outline: none;
      border-color: #00bfff;
    }
    #searchBtn {
      font-family: "Poppins", "Segoe UI", sans-serif;
      font-size: 1rem;
      padding: 8px 15px;
      border: 1px solid #00bfff;
      border-radius: 0 8px 8px 0;
      background: #00bfff;
      color: #121212;
      font-weight: 600;
      cursor: pointer;
    }
    #searchBtn:hover {
      background: #009acd;
    }
    /* End Search Styles */

    #map {
      height: 75vh;
      width: 100%;
    }
    
    /* Animated Map Marker */
    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(0, 191, 255, 0.7);
      }
      70% {
        box-shadow: 0 0 0 15px rgba(0, 191, 255, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(0, 191, 255, 0);
      }
    }
    
    /* Blue marker for Geolocation/Click */
    .map-marker-geo {
      background-color: #00bfff;
      border: 2px solid #ffffff;
      animation: pulse 2s infinite;
    }
    
    /* Red marker for other cities */
    .map-marker-city {
      background-color: #f33;
      border: 2px solid #ffffff;
      opacity: 0.7;
    }
    
    .map-marker-geo, .map-marker-city {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      cursor: pointer;
    }


    .weather-card {
      max-width: 400px;
      margin: 20px auto 40px;
      background: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      display: block; 
    }
    .weather-card h2 {
      margin: 0 0 8px;
      color: #00bfff;
    }
    .temp {
      font-size: 2.5rem;
      font-weight: bold;
    }
    .desc {
      margin: 10px 0;
      text-transform: capitalize;
    }
    
    /* ✨ NEW: Sunrise/Sunset Styles */
    .sun-times {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 15px;
      padding: 10px 0;
      border-top: 1px solid #333;
      border-bottom: 1px solid #333;
      font-weight: 600;
    }
    .sun-times div {
      color: #ddd;
    }
    .sun-times span {
      color: #fff;
      font-weight: 700;
    }
    
    .advice {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    .advice div {
      flex: 1;
      background: #333;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
    }
    .good {
      color: #4CAF50; /* Green */
    }
    .bad {
      color: #F44336; /* Red */
    }

    .forecast {
      margin-top: 20px;
      border-top: 1px solid #333;
      padding-top: 15px;
    }
    .forecast-day {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 8px 0;
      background: #2a2a2a;
      padding: 5px 10px;
      border-radius: 6px;
    }
    .forecast-day img {
      width: 40px;
    }
    
    .loader {
      text-align: center;
      padding: 40px;
      font-size: 1.2rem;
      font-style: italic;
      color: #888;
    }
    .weather-card.error {
      background: #4a1c1c;
      border: 1px solid #f33;
    }
    .weather-card.error h2 {
      color: #f33;
    }

    /* Style for the Layer Control */
    .leaflet-control-layers {
      background: #1e1e1e;
      color: #fff;
      border: 1px solid #444;
    }
    .leaflet-control-layers-base label,
    .leaflet-control-layers-overlays label {
      color: #fff;
    }
    .leaflet-control-layers-separator {
      border-top: 1px solid #444;
    }

  </style>
</head>

// --- Global marker for clicked location ---
let clickedMarker = null;

// --- ✨ NEW: Helper function to format time ---
function formatTime(timestamp) {
  // Multiply by 1000 because JS Date uses milliseconds
  const date = new Date(timestamp * 1000);
  return date.toLocaleTimeString('en-IN', {
    hour: '2-digit',
    minute: '2-digit',
    hour12: true
  });
}

// === Main Functionality ===

// 1. This function runs on page load
function initializeMap() {
  // Add markers for all cities (RED)
  locations.forEach(loc => {
    L.marker([loc.lat, loc.lon], { icon: cityIcon })
      .addTo(map)
      .bindPopup(loc.city)
      .on('click', () => {
        getWeatherByCity(loc.city, loc.city); 
        // ✨ FIXED THE BUG HERE
        map.flyTo([loc.lat, loc.lon], 10);
      });
  });

  // Try to get user's location
  if ('geolocation' in navigator) {
    navigator.geolocation.getCurrentPosition(handleGeoSuccess, handleGeoError);
  } else {
    handleGeoError();
  }
  
  // Search Event Listeners
  searchBtn.addEventListener('click', handleSearch);
  citySearchInput.addEventListener('keyup', (e) => {
    if (e.key === 'Enter') {
      handleSearch();
    }
  });
  
  // Click anywhere on map
  map.on('click', handleMapClick);
}

// 2. Called if user ALLOWS location
function handleGeoSuccess(position) {
  const lat = position.coords.latitude;
  const lon = position.coords.longitude;
  map.setView([lat, lon], 10);
  
  // Remove previous temp marker if it exists
  if (clickedMarker) {
    map.removeLayer(clickedMarker);
  }
  
  L.marker([lat, lon], { icon: geoIcon })
    .addTo(map)
    .bindPopup('Your Location')
    .openPopup();
  getWeatherByCoords(lat, lon);
}

// 3. Called if user BLOCKS location
function handleGeoError() {
  console.warn("Geolocation error. Defaulting to New Delhi.");
  const DELHI_LAT = 28.6139;
  const DELHI_LON = 77.2090;
  map.setView([DELHI_LAT, DELHI_LON], 6); 
  getWeatherByCity('New Delhi', 'New Delhi');
}

// 4. Fetches weather by coordinates (used for geolocation AND map click)
function getWeatherByCoords(lat, lon) {
  const weatherUrl = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${apiKey}&units=metric`;
  const forecastUrl = `https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&appid=${apiKey}&units=metric`;
  fetchAndDisplayWeather(weatherUrl, forecastUrl, "Clicked Location");
}

// 5. Fetches weather by city name (used for markers AND SEARCH)
function getWeatherByCity(cityName, locationName) {
  const weatherUrl = `https://api.openweathermap.org/data/2.5/weather?q=${cityName}&appid=${apiKey}&units=metric`;
  const forecastUrl = `https://api.openweathermap.org/data/2.5/forecast?q=${cityName}&appid=${apiKey}&units=metric`;
  fetchAndDisplayWeather(weatherUrl, forecastUrl, locationName);
}

// Handle Search Function
function handleSearch() {
  const cityName = citySearchInput.value.trim();
  if (cityName) {
    getWeatherByCity(cityName, cityName);
    citySearchInput.value = ''; // Clear input
  }
}

// Handle Click on Map
function handleMapClick(e) {
  const { lat, lng } = e.latlng;
  
  // Remove the previous clicked marker if it exists
  if (clickedMarker) {
    map.removeLayer(clickedMarker);
  }
  
  // Add a new marker (blue, pulsing)
  clickedMarker = L.marker([lat, lng], { icon: geoIcon })
    .addTo(map)
    .bindPopup('Clicked Location')
    .openPopup();
    
  // Pan to the new marker
  map.flyTo([lat, lng], map.getZoom()); // Keep current zoom level
  
  // Fetch weather for these coords
  getWeatherByCoords(lat, lng);
}


// 6. Main function to fetch and build the card
function fetchAndDisplayWeather(weatherUrl, forecastUrl, locationName) {
  weatherCard.innerHTML = '<div class="loader">Loading weather...</div>';
  weatherCard.classList.remove('error');

  let weatherData = {};

  // First, get the current weather
  fetch(weatherUrl)
    .then(res => {
      if (!res.ok) throw new Error(`Weather data not found (${res.status})`);
      return res.json();
    })
    .then(data => {
      weatherData = data; // Save current weather data
      
      // Fly map to searched location (if it's not a map click)
      if (locationName !== "Clicked Location") {
         const { lat, lon } = data.coord;
         map.flyTo([lat, lon], 10);
      }

      const { temp, humidity } = data.main;
      const { sunrise, sunset } = data.sys; // ✨ NEW: Get sunrise/sunset data
      const desc = data.weather[0].description;
      const icon = data.weather[0].icon;
      const iconUrl = `https://openweathermap.org/img/wn/${icon}@2x.png`;
      
      const displayName = (locationName === "Your Location" || locationName === "Clicked Location") ? data.name : locationName;

      // Farmer's Advice
      const rain = desc.includes("rain") || desc.includes("storm");
      const outdoor = (humidity > 85 || temp > 38 || temp < 10);
      const rainAdvice = rain ? "Needed" : "Not Needed";
      const outdoorAdvice = outdoor ? "Poor" : "Good";
      const rainClass = rain ? "bad" : "good";
      const outdoorClass = outdoor ? "good" : "bad";
      const now = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });

      // ✨ UPDATED: Card HTML now includes sun-times div
      weatherCard.innerHTML = `
        <h2>${displayName}</h2>
        <small>As of ${now} GMT+5:30</small>
        <div style="display: flex; align-items: center; gap: 10px; margin-top: 10px;">
          <img src="${iconUrl}" width="50" alt="${desc}">
          <div class="temp">${Math.round(temp)}°C</div>
        </div>
        <div class="desc">${desc}</div>
        
        <div class="sun-times">
          <div>🌅 Sunrise: <span>${formatTime(sunrise)}</span></div>
          <div>🌇 Sunset: <span>${formatTime(sunset)}</span></div>
        </div>
        
        <div class="advice">
          <div><span class="${rainClass}">☔ Rain Gear<br>${rainAdvice}</span></div>
          <div><span class="${outdoorClass}">🧑‍🌾 Field Work<br>${outdoorAdvice}</span></div>
        </div>
        <div class="forecast">
          <strong>3-Day Forecast:</strong>
          <div id="forecastDays">
            <div class="loader">Loading forecast...</div>
          </div>
        </div>
      `;

      // Now, chain the fetch for the forecast
      return fetch(forecastUrl);
    })
    .then(res => {
      if (!res.ok) throw new Error(`Forecast data not found (${res.status})`);
      return res.json();
    })
    .then(forecastData => {
      const forecastContainer = document.getElementById('forecastDays');
      forecastContainer.innerHTML = '';
      
      const filtered = forecastData.list.filter(item => item.dt_txt.includes("12:00:00")).slice(0, 3);

      if(filtered.length === 0) {
        forecastContainer.innerHTML = "Forecast data not available.";
        return;
      }

      filtered.forEach(item => {
        const date = new Date(item.dt_txt);
        const day = date.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });
        const temp = item.main.temp.toFixed(1);
        const icon = item.weather[0].icon;
        const desc = item.weather[0].description;
        const iconUrl = `https://openweathermap.org/img/wn/${icon}.png`;

        forecastContainer.innerHTML += `
          <div class="forecast-day">
            <div>${day}</div>
            <img src="${iconUrl}" alt="${desc}">
            <div>${temp}°C</div>
          </div>
        `;
      });

      document.getElementById('weatherCard').scrollIntoView();
    })
    .catch(err => {
      console.error(err);
      weatherCard.classList.add('error');
      weatherCard.innerHTML = `
        <h2>Error</h2>
        <p>Could not find weather for that location.</p>
        <p><small>${err.message}</small></p>
      `;
    });
}

// Start the app!
initializeMap();

</script>

</html>
